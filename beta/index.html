setzen();

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: eine Spiel-Spalte (max. 520px) mit Kopfleiste (Level, XP, Talente, Serie); Bildschirme wechseln darunter. Bewusst dunkles Nachthimmel-Design, Akzent per Thema tauschbar. */
:root{
  --bg:#0e1226; --bg2:#151a36; --surface:#1b2146; --surface2:#262e5e; --line:#323b74;
  --fg:#eef0ff; --muted:#a3abd8; --accent:#f2c14e; --accent-ink:#2a1d00;
  --good:#46d39a; --bad:#ff6b6b; --at:#7cc4ff; --nt:#ffa3c4;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
body[data-acc="smaragd"]{--accent:#3fd6a6;--accent-ink:#00281b}
body[data-acc="purpur"]{--accent:#c09bff;--accent-ink:#1d0b3a}
body[data-acc="morgenrot"]{--accent:#ff8a5c;--accent-ink:#2e0d00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 60%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 88% 44%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 22% 82%,#fff5 50%,transparent 51%),radial-gradient(1.5px 1.5px at 63% 88%,#fff4 50%,transparent 51%),radial-gradient(ellipse at 50% -10%,#2b2f6e 0%,transparent 60%);
  background-attachment:fixed;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font-family:var(--body);color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Kopfleiste */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding-block:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.hud-wer{display:flex;gap:10px;align-items:center;min-width:0;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}.hud-wer .xpbox{flex:1;display:block}.hud-wer .xptitle,.hud-wer .xpnum,.hud-wer .xpbar{display:block}.hud-wer .lvl{flex:none}
.lvl{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:900 1.15rem var(--body);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 55%,transparent)}
.xpbox{min-width:0}
.xptitle{font-weight:800;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:9px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#fff);transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.xpnum{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}

/* Allgemein */
h1{font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1.15;margin:6px 0 4px;letter-spacing:.02em;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0 0 4px;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900;font-size:1rem;cursor:pointer;background:var(--surface2);border-bottom:4px solid #0007;transition:transform .08s}
.btn:active{transform:translateY(3px);border-bottom-width:1px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.back{background:none;border:0;color:var(--muted);font-weight:800;padding:6px 0;cursor:pointer;font-size:.95rem}

/* Startseite */
.goal{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.ring{width:72px;height:72px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:128px;border-bottom:4px solid #0006;transition:transform .08s}
.mode:active{transform:translateY(3px)}
.mode .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2)}
.mode .ic svg{width:22px;height:22px}
.mode b{font-size:1.02rem}
.mode span{font-size:.82rem;color:var(--muted)}
.mode.big{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--surface)),var(--surface))}

/* Lernpfad */
.path{display:flex;flex-direction:column;align-items:center;gap:0;padding-block:8px}
.node{display:flex;align-items:center;gap:14px;width:100%;max-width:400px}
.node:nth-child(4n+2){padding-left:18%}.node:nth-child(4n+4){padding-right:18%;flex-direction:row-reverse;text-align:right}
.nbtn{flex:0 0 auto;width:68px;height:68px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;font:900 1.2rem var(--body);background:var(--surface2);border-bottom:6px solid #0008;position:relative}
.nbtn svg{width:26px;height:26px}
.nbtn.open{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}
.nbtn.done{background:var(--good);color:#002b19}
.nbtn.locked{opacity:.45;cursor:not-allowed}
.ninfo{min-width:0}
.ninfo b{display:block;font-size:.98rem}
.stars{display:inline-flex;gap:2px;margin-top:2px}
.stars svg{width:16px;height:16px}
.connector{width:4px;height:22px;background:var(--line);border-radius:2px}
.tag{display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.08em;padding:2px 7px;border-radius:6px;margin-bottom:3px}
.tag.at{background:color-mix(in srgb,var(--at) 22%,transparent);color:var(--at)}
.tag.nt{background:color-mix(in srgb,var(--nt) 22%,transparent);color:var(--nt)}

/* Spielflächen */
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:48px;padding:10px;border:2px dashed var(--line);border-radius:14px}
.slot{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border-radius:10px;padding:6px 10px;font-weight:800;animation:pop .25s}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:12px;padding:10px 13px;font-weight:800;font-size:1rem;background:var(--surface2);border-bottom:4px solid #0008;cursor:pointer}
.chip:active{transform:translateY(3px)}
.chip.no{background:var(--bad);color:#2b0000;animation:shake .35s}
.q{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;text-align:center;margin:6px 0;text-wrap:balance}
.qsub{text-align:center;font-size:.85rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:0;border-radius:14px;padding:16px 8px;min-height:var(--opth,62px);font-weight:900;font-size:1.02rem;background:var(--surface2);border-bottom:5px solid #0008;cursor:pointer}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--good);color:#002b19;animation:pop .3s}
.opt.wrong{background:var(--bad);color:#2b0000;animation:shake .35s}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:900;font-variant-numeric:tabular-nums}
.timer{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.combo{font-family:var(--display);font-weight:800;color:var(--accent);font-size:1.1rem;min-height:1.5em;text-align:center}
.combo.hot{text-shadow:0 0 12px var(--accent);animation:pulse .6s infinite alternate}
.progress{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--at),var(--nt));transition:width .3s}
.result{text-align:center}
.result .big{font-family:var(--display);font-size:2.6rem;font-weight:800;color:var(--accent)}
.rewards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* Spickzettel */
.grp{border-top:1px solid var(--line);padding-top:12px}
.grp:first-child{border-top:0;padding-top:0}
.blist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bk{display:inline-flex;gap:6px;align-items:baseline;background:var(--surface2);border-radius:9px;padding:5px 9px;font-weight:700;font-size:.93rem;border:0;cursor:pointer}
.bk .n{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bk.hid .t{color:transparent;background:var(--line);border-radius:4px}

/* Abzeichen & Laden */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.badge .medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.badge .medal svg{width:28px;height:28px}
.badge.got .medal{background:radial-gradient(circle at 35% 30%,#fff 0%,var(--accent) 45%,color-mix(in srgb,var(--accent) 50%,#000) 100%);box-shadow:0 0 16px color-mix(in srgb,var(--accent) 50%,transparent)}
.badge:not(.got){opacity:.55}
.badge b{font-size:.82rem;line-height:1.2}
.badge span{font-size:.7rem;color:var(--muted);line-height:1.25}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.swatch{height:46px;border-radius:12px}
.item .btn{padding:9px 10px;font-size:.9rem}

/* Teilen */
.qrbox{background:#fff;border-radius:18px;padding:14px;max-width:280px;margin:0 auto;box-shadow:0 0 30px color-mix(in srgb,var(--accent) 40%,transparent)}
.qrbox svg{display:block;width:100%;height:auto}
.url{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;word-break:break-all;background:var(--bg2);border-radius:10px;padding:10px;text-align:center;user-select:all}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Gemeinde */
.church{display:flex;align-items:center;gap:10px;margin-top:4px}
.church img{width:40px;height:40px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px #ffffff22,0 4px 14px #0008}
.church span{font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.church.lg img{width:56px;height:56px}

/* Rangliste */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:800;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.pod .nm{font-weight:800;font-size:.9rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .vl{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pod .base{width:100%;border-radius:12px 12px 0 0;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--muted)}
.pod.p1 .base{height:96px;background:color-mix(in srgb,#f2c14e 30%,var(--surface2));color:#f2c14e}
.pod.p2 .base{height:68px}.pod.p3 .base{height:48px}
.pod.me .nm{color:var(--accent)}
.rlist{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .rk{font-weight:900;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rrow .who{min-width:0}
.rrow .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .who span{font-size:.78rem;color:var(--muted)}
.rrow .val{font-weight:900;font-variant-numeric:tabular-nums}
.rrow.me{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:12px;border-top-color:transparent}
.rrow.me+.rrow{border-top-color:transparent}
.who .you,.you{display:inline-block;color:var(--accent-ink)!important;font-size:.65rem;font-weight:900;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.field{width:100%;font:700 1.05rem var(--body);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--fg)}
.field:focus{outline:none;border-color:var(--accent)}
.mystat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mystat div{background:var(--bg2);border-radius:12px;padding:10px 4px}
.mystat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.mystat span{font-size:.72rem;color:var(--muted)}

/* Overlays */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.float{position:fixed;z-index:41;pointer-events:none;font-weight:900;font-size:1.2rem;color:var(--accent);text-shadow:0 2px 8px #000a;animation:floatUp 1s ease-out forwards}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;background:var(--surface2);border:1px solid var(--accent);border-radius:16px;padding:12px 16px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px #000a;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3)}
.toast svg{width:30px;height:30px;flex:0 0 auto}
.modal{position:fixed;inset:0;z-index:50;background:#05071acc;display:grid;place-items:center;padding:24px;backdrop-filter:blur(4px)}
.modal .card{max-width:360px;width:100%;text-align:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.modal .lvlbig{width:96px;height:96px;margin:4px auto 10px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:900 2.4rem var(--body);box-shadow:0 0 40px var(--accent);animation:spinIn .8s cubic-bezier(.2,.9,.3,1.2)}
.modal .stars svg{width:40px;height:40px}
.shake-screen{animation:shake .35s}

@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes floatUp{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.3)}}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,30px)}}
@keyframes spinIn{from{transform:rotate(-200deg) scale(.2)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:380px){.q{font-size:1.65rem}.pill{padding:4px 7px;font-size:.82rem}.badges{grid-template-columns:repeat(2,1fr)}}

/* ===== Version 6: Ergänzungen ===== */
:root{--g-geschichte:#5fd38a;--g-lehre:#ffd95c;--g-prophetie:#ff7b7b;--serif:"Source Serif 4",Georgia,"Times New Roman",serif}
code{font-family:ui-monospace,Consolas,monospace;font-size:.85em;background:var(--bg2);padding:1px 5px;border-radius:5px}
.vers{margin:0;padding:12px 14px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-radius:0 14px 14px 0;text-align:left}
.vers blockquote{margin:0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.1rem;line-height:1.45}
.vers figcaption{font-size:.74rem;color:var(--muted);margin-top:6px;letter-spacing:.04em}

/* Bereichsfarben – dezente Orientierung: Lernen blau, Spielen bernstein, Gemeinde grün, Belohnungen violett */
:root{--ar-lernen:#7fc8ff;--ar-spielen:#b38cff;--ar-gemeinde:#ff8a5c;--ar-lohn:#b38cff;--ar:var(--accent)}
[data-go="lernen"],[data-go="lernverse"],[data-go="lied"],[data-go="learn"],[data-go="lektion"],[data-go="path"]{--ar:var(--ar-lernen)}
[data-go="spielen"],[data-go="blitz"],[data-go="chain"],[data-go="gap"]{--ar:var(--ar-spielen)}
[data-go="rank"],[data-go="profil"],[data-go="share"],[data-go="postfach"]{--ar:var(--ar-gemeinde)}
[data-go="shop"],[data-go="badges"]{--ar:var(--ar-lohn)}
.bereich{background:linear-gradient(135deg,color-mix(in srgb,var(--ar) 14%,var(--surface)),var(--surface) 70%);border-color:color-mix(in srgb,var(--ar) 28%,var(--line))}

.leiste button svg{width:30px!important;height:30px!important}
/* Symbole „Himmlisches Licht“: Glanz, Funkeln, gesperrte Zustände */

.wr .wr-spark{transform-box:fill-box;transform-origin:center;opacity:0;animation:wrFunkeln 3.4s ease-in-out infinite}

@keyframes wrFunkeln{0%,70%,100%{opacity:0;transform:scale(.3)}80%{opacity:1;transform:scale(1)}}

.tq-preis.bereit .tp-auf{margin-top:2px}
.tf-truhe{position:relative}
.tf-schloss{position:absolute;width:38px;height:38px;left:calc(var(--x) / 64 * 100% - 19px);top:calc(28.5 / 64 * 100%);filter:drop-shadow(0 3px 3px #0008)}
.tf-schloss svg{width:100%;height:100%}
.tf-klick{position:absolute;left:50%;top:62%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#fff8d8;opacity:0}
.tf-schl{position:absolute;width:44px;height:44px;left:calc(var(--x) / 64 * 100% - 22px);top:calc(28.5 / 64 * 100% - 22px);opacity:0;
 transform:translate(var(--sx),340px) rotate(-200deg) scale(1.6);transition:transform .65s cubic-bezier(.3,1.25,.5,1) var(--v),opacity .2s var(--v);filter:drop-shadow(0 0 10px #f2c14e)}
.tf-schl svg{width:100%;height:100%}
.truhe-fx.schluessel .tf-schl{opacity:1;transform:rotate(90deg)}
.truhe-fx.drehen .tf-schl{animation:schlDrehen .35s ease-in-out var(--v) forwards}
@keyframes schlDrehen{0%{transform:rotate(90deg) scaleY(1)}50%{transform:rotate(90deg) scaleY(-.2)}100%{transform:rotate(90deg) scaleY(-1)}}
.truhe-fx.drehen .tf-klick{animation:klickBlitz .45s ease-out calc(var(--v) + .2s)}
@keyframes klickBlitz{0%{opacity:1;transform:scale(1);box-shadow:0 0 12px 6px #f2c14e}100%{opacity:0;transform:scale(9);box-shadow:0 0 30px 10px #f2c14e00}}
.truhe-fx.loesen .tf-schloss,.truhe-fx.loesen .tf-schl{animation:schlossAb .6s cubic-bezier(.5,-.4,.7,1) var(--v) forwards}
@keyframes schlossAb{0%{opacity:1;transform:translateY(0) rotate(0)}30%{transform:translateY(-14px) rotate(-12deg)}100%{opacity:0;transform:translateY(120px) rotate(40deg)}}
.truhe-fx.loesen .tf-schl{animation-name:schlAb}
@keyframes schlAb{0%{opacity:1;transform:rotate(90deg) scaleY(-1)}100%{opacity:0;transform:translateY(-80px) rotate(180deg) scale(.4)}}

/* ===== Reiter „Schatz“ ===== */
.tabbar .tb-badge{position:absolute;top:1px;left:calc(50% + 4px);min-width:24px;height:16px;padding:0 5px;border-radius:999px;background:linear-gradient(#ffe39a,#d99c25);color:#2a1d02;font:900 .6rem/16px var(--body);box-shadow:0 0 0 2px #151a3d,0 0 8px #f2c14e88;text-align:center}

/* ===== Schatz als Umkleide ===== */
.pz{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:999px;font:900 .72rem var(--body);color:#ffe39a;background:linear-gradient(180deg,#4a360c,#2a1d05);border:1px solid #f2c14e99;box-shadow:0 0 10px -3px #f2c14e;white-space:nowrap}

.kb-buehne{display:grid;grid-template-columns:116px 1fr;gap:14px;align-items:center;padding:14px;border-radius:24px;margin-bottom:10px;position:relative;overflow:hidden;
 background:radial-gradient(70% 100% at 18% 50%,#b38cff45,transparent 70%),linear-gradient(160deg,#ffffff14,#ffffff04),var(--surface);border:1px solid #b38cff55;box-shadow:inset 0 1px 0 #ffffff22,0 16px 30px -18px #000}

/* Granatapfel – Saum mit Granatäpfeln und goldenen Glöckchen (2. Mose 28,33-34) */

/* Gemeinde: fester Kopf der Rangliste (v6.27) – Titel/Zahl oben, Umschalter immer darunter in voller Breite, gleich große Felder */
.rk-kopf{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:6px}

/* Lernvers des Monats: Karte mit Einprägen-Stufen (Startseite + Archiv) */
.lv{position:relative;overflow:hidden;padding:13px 15px 12px;border-radius:20px;border:1px solid #f2c14e38;color:var(--fg);

.vl-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* Vers-Duell */

.bq4-k>svg{position:absolute;right:8px;top:9px;width:16px;height:16px;opacity:.9}
.bq4-solo{background:linear-gradient(150deg,#d6f7a6,#55b832 42%,#2f8f26);box-shadow:inset 0 1px 0 #fff8,inset 0 0 0 1.5px #fff3,0 4px 0 #1d5a14,0 12px 24px -12px #7be04a}
.bq4-duell{background:linear-gradient(150deg,#ffcf6a,#ff8a5c 46%,#ff5f8f);box-shadow:inset 0 1px 0 #fff8,inset 0 0 0 1.5px #fff3,0 4px 0 #a33a4c,0 12px 24px -12px #ff8a5c}
.bq4-solo:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #fff8,0 2px 0 #1d5a14}.bq4-duell:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #fff8,0 2px 0 #a33a4c}
.bq4-duell[aria-expanded="true"]{box-shadow:inset 0 1px 0 #fff8,inset 0 0 0 2px #fff,0 4px 0 #a33a4c}
.bq4-k.aus{filter:grayscale(1);opacity:.55;cursor:default}
.bq4-chip{display:inline-flex;align-items:center;gap:4px;font:900 .6rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:#0e122655;color:#fff;box-shadow:inset 0 0 0 1px #fff5;white-space:nowrap}
.bq4-chip svg{width:12px;height:12px}
.bq4-bild{display:flex;align-items:center;gap:4px;margin-top:2px}
.bq4-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font:900 .95rem var(--display);color:#1b2a55;background:radial-gradient(circle at 40% 30%,#fff,#f2ffe2 45%,#bfeee7);box-shadow:0 0 0 2px #fff8,0 2px 6px #0005}
.bq4-av.f{background:radial-gradient(circle at 40% 30%,#fff,#ffe6d6 45%,#ffb39a)}
.bq4-vs{font:900 .8rem var(--display);color:#fff;text-shadow:0 0 6px #fff,0 1px 2px #a33a4c}
.bq4-tt{font:800 1.05rem/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 2px #0007}
.bq4-sub{font:700 .7rem/1.25 var(--body);opacity:.95;text-shadow:0 1px 2px #0005;position:relative;z-index:1}
.bq4-woche{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:5px 10px 5px 6px;border:0;border-radius:14px;overflow:hidden;cursor:pointer;color:inherit;font:inherit;text-align:left;box-sizing:border-box;
  background:radial-gradient(ellipse at 0% 50%,#f2c14e40,transparent 60%),linear-gradient(180deg,#2a2550,#1b1e44);box-shadow:inset 0 0 0 1px #f2c14e88,inset 0 0 0 4px #1b1e44,inset 0 0 0 5px #f2c14e33,0 3px 0 #0006}

.bq4-kr{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#f2c14e44,transparent 70%);box-shadow:inset 0 0 0 2px #f2c14eaa}

.bq4-woche small{display:block;font:700 .68rem var(--body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bq4-uhr{display:flex;flex-direction:column;align-items:center;line-height:1;padding:4px 8px;border-radius:9px;background:#f2c14e;color:#2a1d02;font:900 1rem var(--display)}
.bq4-uhr small{font:900 .5rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:#2a1d02}.bq4-uhr svg{width:18px;height:18px}
.bq4-woche.aus{opacity:.6;cursor:default}.bq4-woche.aus .bq4-kr{filter:grayscale(1)}

/* 6.57: Bereichs-Kopf im Arena-Stil für Start, Lernen, Spielen, Biblionär (Medaillon links, goldener Titel, Untertitel in Bereichsfarbe, Ring rechts, Bogen-Trenner, Tafel, Startknopf) */
.bk-kopf{position:relative;display:grid;grid-template-columns:58px minmax(0,1fr) 58px;gap:10px;align-items:center;padding:2px 2px 16px;margin:0 0 8px}
.bk-kopf::after{content:"";position:absolute;left:0;right:0;bottom:0;height:11px;background:radial-gradient(circle at 50% 100%,transparent 4.2px,#f2c14e66 4.8px,#f2c14e66 6px,transparent 6.6px) 0 0/15px 11px repeat-x;border-bottom:1.5px solid #f2c14e55}
.bk-med{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 32%,color-mix(in srgb,var(--bk) 75%,#fff),color-mix(in srgb,var(--bk) 55%,#0e1226) 55%,#0e1226);box-shadow:inset 0 0 0 3px var(--bk),inset 0 0 0 6px #0e122655,0 0 14px color-mix(in srgb,var(--bk) 55%,transparent)}
.bk-med svg{width:62%;height:62%;filter:drop-shadow(0 1px 1px #0008)}
.bk-med.bild{background:none;box-shadow:none}.bk-med.bild img{width:62px;height:auto;display:block;filter:drop-shadow(0 0 10px #4aa8ff77)}
.bk-t{min-width:0}.bk-t h1{margin:0;font:800 1.65rem/1.05 var(--display);letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(180deg,#fff,#fff1c2 40%,#f2c14e 75%,#c9902a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #1b2a55);white-space:nowrap}
.bk-t span{display:block;font:800 .82rem var(--body);color:var(--bk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-ring{width:58px;height:58px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#f2c14e24,#f2c14e08 70%);box-shadow:inset 0 0 0 2px #f2c14e88,inset 0 0 0 5px #0e1226,inset 0 0 0 6px #f2c14e44,0 0 14px #f2c14e33}
.bk-ring b{font:800 1.05rem/1 var(--display);color:#f2c14e;text-shadow:0 0 10px #f2c14e88;font-variant-numeric:tabular-nums}.bk-ring small{font:800 .52rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bk-tafel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:12px;background:linear-gradient(180deg,#ffffff0d,#ffffff04),var(--surface);box-shadow:inset 0 0 0 1px #f2c14e40,inset 0 0 0 4px var(--surface),inset 0 0 0 5px #f2c14e1f;margin-bottom:10px;overflow:hidden}
.bk-tafel>span{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:7px 2px;font:800 .72rem var(--body);color:var(--muted);white-space:nowrap;min-width:0}
.bk-tafel>span+span:not(.bk-zeile){border-left:1px solid #f2c14e26}
.bk-tafel b{font:800 1rem var(--display);color:#f2c14e;font-variant-numeric:tabular-nums}
.bk-zeile{grid-column:1/-1;display:grid!important;grid-template-columns:20px auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 12px 8px!important;border-top:1px solid #f2c14e26}
.bk-zeile svg{width:20px;height:20px}.bk-zeile em{font-style:normal;color:var(--fg);font-weight:800}
.bk-bar{height:6px;border-radius:3px;background:#ffffff14;overflow:hidden}.bk-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#fff1c2,#f2c14e)}
.bk-start{display:flex;align-items:center;gap:10px;width:100%;height:50px;padding:0 14px 0 10px;border:0;border-radius:14px;cursor:pointer;color:#fff;margin:0 0 4px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--bk) 55%,#ffcf6a),color-mix(in srgb,var(--bk) 80%,#1b2a55) 50%,color-mix(in srgb,var(--bk) 50%,#3a2a8a));box-shadow:inset 0 1px 0 #fff7,inset 0 0 0 1.5px #fff3,0 4px 0 color-mix(in srgb,var(--bk) 45%,#0e1226),0 10px 22px -10px var(--bk)}

.bk-start>svg:first-child{width:34px;height:34px;flex:none}.bk-start>svg:last-child{width:18px;height:18px;flex:none;margin-left:auto}
.bkopf{min-width:0}.bk-start b{min-width:0;font:800 1.02rem var(--display);letter-spacing:.1em;text-transform:uppercase;text-shadow:0 1px 2px #000a,0 0 6px #0005;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-label{display:flex;align-items:center;gap:8px;margin:9px 2px 6px;font:800 .74rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:#e9d6a8}

.bk-label i{font:900 .66rem/18px var(--body);font-style:normal;letter-spacing:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;text-align:center;color:#fff;background:var(--ci-farbe-signal);box-shadow:0 0 8px #e8141b88}

/* ===== 8.1: Start und Zusammen im selben Stil wie Lernen und Allein ===== */

.dt-sub{font:700 .7rem/1.1 var(--body);color:var(--muted);text-align:center}

.zus-typen .du-typ.t-quiz{min-height:0;padding:11px 10px;flex-wrap:wrap;column-gap:10px;row-gap:0}

.zus-typen .du-typ.t-quiz .dt-name{font-size:1.05rem}
.zus-typen .du-typ.t-quiz .dt-sub{flex-basis:auto;margin-left:2px}
.zus-ketten{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px;border-radius:14px;border:1px solid color-mix(in srgb,var(--dt) 35%,transparent);background:color-mix(in srgb,var(--dt) 9%,var(--surface))}
.zus-kk{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:11px;border:1px solid color-mix(in srgb,var(--dt) 40%,transparent);background:var(--surface2);color:var(--fg);font:800 .72rem/1.1 var(--body);cursor:pointer;min-width:0}
.zus-kk span svg{width:30px;height:30px;display:block}
.zus-kk b{font-weight:800;text-align:center;overflow-wrap:anywhere}
.zus-kk.zuletzt{border-color:var(--dt);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--dt) 55%,transparent)}
.zus-hinweis{margin:0 2px 8px}
.ez.ez-k,.start8 .ez,.start8 .ez-aufg>summary{padding:10px 14px;gap:12px}
.ez-k .ez-ic,.start8 .ez-ic{width:42px;height:42px}.ez-k .ez-ic svg,.start8 .ez-ic svg{width:30px;height:30px}.ez-k .ez-ic .sf-logo svg{width:40px;height:40px}
.ez-k .ez-tx b,.start8 .ez-tx b{font-size:1.1rem}.ez-k .ez-tx small,.start8 .ez-tx small{font-size:.86rem;margin-top:0}
.start8{gap:8px}.start8 .ez-liste{gap:8px}
.start8 .ez-pf{font-size:1.5rem}
.gegner-seite{display:flex;flex-direction:column;gap:0}
.gegner-seite .du-gegner{margin-top:0}
.gegner-seite .du-gegner{--abz:520px}

/* ===== 8.2: eigene Farben (Allein = Violett, Zusammen = Koralle), Kopf ohne Zusatzinfos, gemeinsame Spielauswahl ===== */
.bk-kopf{grid-template-columns:58px minmax(0,1fr)}
.bk-ring,.bk-tafel{display:none!important}
.bk-t span{font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbar [data-tab="spielen"]{--ar:var(--ar-spielen)}.tabbar [data-tab="zusammen"]{--ar:var(--ar-gemeinde)}
/* Start: Der Kopf ist die Tagesaufgabe (Truhe statt Sonne) */
.start-aufg{margin:0}
.start-aufg .bk-aufg{grid-template-columns:58px minmax(0,1fr) auto;width:100%;box-sizing:border-box;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;list-style:none}
.start-aufg summary.bk-aufg::-webkit-details-marker{display:none}
.start-aufg .bk-med.truhe{background:none;box-shadow:none;width:62px;height:58px;filter:drop-shadow(0 0 8px #f2c14e66)}
.start-aufg .bk-med.truhe svg{width:100%;height:100%}
.start-aufg .ez-keys i{width:20px;height:20px}

@keyframes truheWipp{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.start-aufg .bk-aufg.bereit .bk-med.truhe{animation:none}}
.start-aufg .heute3{margin:0 0 6px}
/* Spielauswahl (Allein und Zusammen identisch) */
.sp-menue{--ar:var(--ar-spielen)}
.sp-menue .bk-label:first-child{margin-top:2px}
.sp-gitter{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sp-k{width:100%;cursor:pointer;color:var(--fg);font:inherit;padding:9px 12px!important}
.sp-gitter .sp-k{grid-template-columns:40px minmax(0,1fr);gap:10px;padding:8px 10px!important;min-height:56px}
.sp-gitter .sp-k .b-ic{width:40px;height:40px}.sp-gitter .sp-k .b-ic svg{width:30px!important;height:30px!important}
.sp-k .b-tx b{font-size:.98rem!important}
.sp-gitter .sp-k .b-tx b{font-size:.9rem!important;line-height:1.15}
.sp-k .b-tx span{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-k .b-ic .sf-logo svg{width:34px;height:34px}
.sp-duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.sp-aus{opacity:.5;filter:grayscale(.4)}
.sp-menue + .bk-label{margin-top:10px}
.btn.primary.du-fordern,.du-los-knopf.btn.primary{background:linear-gradient(180deg,#ffc0a0,#ff8a5c 55%,#c9502a);color:#2a0d00}

/* ===== 8.3: Rangliste + Laden als eigener Reiter (grün), 5 Reiter, breiter Duelle-Knopf ===== */
body[data-tab="rank"]{--ar-gemeinde:#5fe0b0;--ar:#5fe0b0}
.tabbar{grid-template-columns:repeat(5,minmax(0,1fr))}
.tabbar button{font-size:.72rem;letter-spacing:-.01em}

.sp-duo.sp-breit{grid-template-columns:minmax(0,1fr)}
.rl-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:10px 0 2px;border-radius:14px;background:#0003;border:1px solid #ffffff1a}

.truhe-haken{position:absolute;right:-4px;bottom:-2px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#6fe39a,#1f9a58);border:2px solid #0f1530;box-shadow:0 2px 6px #0009}
.truhe-haken svg{width:14px!important;height:14px!important;color:#fff;stroke:#fff}
.start-aufg .ez-keys.verbraucht{opacity:.35;filter:grayscale(.6)}
.start-aufg:has(.truhe.offen) .bk-t h1{color:#6fe39a}
/* ===== 8.4: Duell-Karte „Du bist dran“ auf Start und Zusammen ===== */
.du-dran{margin:0;padding:0;list-style:none}
/* ===== 8.5: Rüstungs-Symbole im Laden-Raster (steckten in einem Hüllen-Span und hatten Breite 0) ===== */
.kb-item .vor>span{display:grid;place-items:center;width:100%;height:48px}
.kb-item .vor>span:not(.av)>svg{width:46px;height:46px;overflow:visible;filter:drop-shadow(0 0 6px #b38cff66)}
/* ===== 8.7: Duelle oben im Reiter Zusammen ===== */
.bk-label .zus-alle{margin-left:auto;border:0;background:none;color:var(--muted);font:800 .78rem var(--body);cursor:pointer;padding:4px 2px;white-space:nowrap}
.du-dran{display:grid;gap:6px;margin:0 0 10px}

/* ===== 9.0: Gemeinden – Umschalter, Gemeinde-Wertung, Auswahl, Verwaltung ===== */
.rk-scope{margin:0 0 8px}
.rk-scope button{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.8rem}
.rk-scope button svg{width:20px;height:20px}
.du-trenn{display:flex;align-items:center;gap:8px;margin:6px 2px 2px;font:800 .66rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#9aa3c7)}

.gem-liste{max-height:50vh;max-height:50dvh;overflow:auto}
.gv-zeile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}.gv-zeile .small{grid-column:1}.gv-zeile .btn{grid-column:2;grid-row:1/3}
/* ===== 9.2: Rahmen um „Level n“ füllt sich mit dem Fortschritt; genaue XP-Info ===== */
.hud .hlvl-t{--lp:0%;border:3px solid transparent;padding:0 8px;background:linear-gradient(#10152f,#10152f) padding-box,linear-gradient(90deg,#ffd978 var(--lp),#f2c14e40 var(--lp)) border-box;box-shadow:0 0 8px #f2c14e22}

.xi-balken{height:12px;border-radius:8px;background:#ffffff14;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff1a}.xi-balken>i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#f2c14e,#ffe9a0)}
.xi-zeilen{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:.84rem;text-align:left}.xi-zeilen span{color:var(--muted);text-align:left}.xi-zeilen b{text-align:right}
.ich-menue .xpinfo{margin:0 0 10px;padding:10px;border-radius:14px;background:#ffffff0a;border:1px solid #ffffff14}
/* ===== 9.3: kompaktes Profil ===== */
.pf-kompakt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;align-items:center;padding:10px 12px}
.pf-kompakt .pf-name{min-width:0}.pf-kompakt h2{font-size:1.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-wechsel{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px}.pf-wechsel svg{width:22px;height:22px}
.pf-karte{padding:10px 12px;gap:8px}
.pf-karte .titelkarte>.small.muted{display:none}.pf-karte .titelkarte .small{font-size:.78rem}.pf-karte .titelkarte+.titelkarte{border-top:1px solid #ffffff14;padding-top:8px}
.pf-det{padding:0;margin-top:8px}.pf-det>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:800}.pf-det>summary::-webkit-details-marker{display:none}
.pf-det>summary::after{content:"›";float:right;transition:transform .15s}.pf-det[open]>summary::after{transform:rotate(90deg)}
.pf-det>:not(summary){margin:0 14px 12px}
.xi-eine{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}.xi-eine b{color:var(--fg)}
/* ===== 9.4: Laden – Symbole in Form und Größe (Rüstungs-Regel traf auch Avatare, Rahmen und Farbfelder) ===== */
.kb-item .vor>span:not(.av):not(.swatch):not(.kb-titel-ic){display:grid;place-items:center;width:100%;height:48px}
.kb-item .vor>.av{width:var(--s);height:var(--s);display:inline-grid;flex:none}
.kb-item .vor>.swatch{width:40px;height:40px;display:block;flex:none}

.kb-item .vor>.kb-titel-ic>svg{width:44px;height:44px}
.kb-item .vor{width:100%;justify-content:center}
.kb-item small{overflow-wrap:anywhere;hyphens:auto;max-width:100%;font-size:.64rem}
.kb-info b{overflow-wrap:anywhere;hyphens:auto;max-width:100%;font-size:clamp(1.05rem,5vw,1.35rem)}
.pf-gross{width:100%;box-sizing:border-box;margin:0 0 8px}

/* ===== 9.7: Laden-Symbol bei den Talenten, Gemeinde-Karte im Profil, Logos, Gemeinde-Wertung, Spielkacheln mit Fortschritt, Neuigkeiten ===== */
.hud-tal{gap:5px;padding:6px 9px 6px 12px}
.hud-shop{display:inline-grid;place-items:center;padding-left:7px;margin-left:2px;border-left:1px solid #f2c14e55}
.hud-shop svg{width:24px!important;height:24px!important}
.gem-logo{--s:40px;display:inline-grid;place-items:center;flex:none;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;background:#ffffff12;border:1px solid #ffffff2a;box-sizing:border-box}
.gem-logo img{width:100%;height:100%;object-fit:contain;display:block}
.gem-logo.gem-init{background:linear-gradient(145deg,hsl(var(--h) 55% 38%),hsl(var(--h) 55% 24%));border-color:hsl(var(--h) 60% 60%/.6);font:900 calc(var(--s)*.34)/1 var(--display);letter-spacing:.02em;color:#fff}
.gem-logo.gem-gast svg{width:60%;height:60%}
.pf-gem{display:grid;gap:10px;padding:10px 12px;margin:8px 0}
.pf-gem-zeile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}

.gb-liste{display:grid;gap:8px;max-height:46vh;max-height:46dvh;overflow:auto}
.gb-opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:9px 12px;border-radius:14px;border:1px solid #ffffff22;background:#ffffff0a;color:var(--fg);font:inherit;cursor:pointer;min-height:56px}
.gb-opt b{font:800 1rem/1.2 var(--body);overflow-wrap:anywhere}.gb-opt i{font-style:normal;color:var(--muted);font-size:1.3rem}
.gb-pw{display:grid;gap:8px}.gb-kopf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}.gb-kopf b{font:800 1rem/1.2 var(--body);overflow-wrap:anywhere}
.gb-fehler{color:#ff9a8a;font-weight:700;font-size:.85rem;min-height:1.2em}
@keyframes gbWackel{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gb-wackel{animation:gbWackel .35s}
.gv-karte{display:grid;gap:8px}.gv-kopf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}.gv-kopf b{overflow-wrap:anywhere}
.gv-logozeile{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.gv-logozeile input[type=file]{font-size:.78rem;max-width:100%}
.sp-k{position:relative}
.sp-fort{position:absolute;left:12px;right:12px;bottom:3px;height:3px;border-radius:3px;background:#ffffff1c;overflow:hidden;pointer-events:none}
.sp-fort>i{display:block;height:100%;border-radius:3px;background:var(--ar,var(--gold,#f2c14e))}

.nach-liste{display:grid;gap:10px;max-height:56vh;max-height:56dvh;overflow:auto}

.nach-karte p{margin:0;font-size:.92rem;line-height:1.45;overflow-wrap:anywhere}
.nach-neu{display:inline-block;margin-left:6px;font:800 .62rem var(--body);padding:2px 7px;border-radius:8px;background:#ff6b57;color:#fff;vertical-align:middle}
/* Kopfzeile: sehr langer Name in zwei Zeilen statt abgeschnitten (Höhe der Kopfzeile bleibt) */
.hud .xptitle.zwei{display:-webkit-box!important;-webkit-box-orient:vertical;-webkit-line-clamp:2;white-space:normal;overflow:hidden;line-height:1.08;letter-spacing:.01em;overflow-wrap:anywhere}
.hud .zweizeilig .hlvl-t{display:none}
/* 9.10: Profil als Spielerausweis + Errungenschaften und Statistik */
.pf2{display:grid;gap:12px;padding-bottom:20px}
.pf2 svg.pf2-i{width:20px;height:20px;flex:none}.pf2 svg.pf2-pf{width:16px;height:16px;flex:none;color:var(--muted)}
.pf2-tr{display:flex;align-items:center;gap:10px;margin:2px 2px 0;color:var(--accent);font:800 .78rem var(--display);letter-spacing:.14em;text-transform:uppercase;width:100%}
.pf2-tr i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#f2c14e99)}.pf2-tr i:last-child{background:linear-gradient(270deg,transparent,#f2c14e99)}

.pf2-edit{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid #f2c14e88;background:#f2c14e18;color:var(--accent);display:grid;place-items:center;padding:0;cursor:pointer}
.pf2-edit svg{width:17px;height:17px}.pf2-edit.ok{background:var(--accent);color:var(--accent-ink)}
.pf2-input{flex:1;min-width:0;text-align:center;font-weight:800}
.pf2-rang{display:inline-block;border:1px solid #f2c14e66;border-radius:999px;padding:2px 12px;font:800 .8rem var(--body);color:var(--accent)}
.pf2-xp{width:100%;max-width:300px;display:grid;gap:4px}.pf2-xp>span{font-size:.8rem;color:var(--muted)}.pf2-xp>span b{color:var(--fg)}

.pf2-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;border:1px solid #ffe39a;background:linear-gradient(180deg,#ffd978,#f2c14e);color:var(--accent-ink);border-radius:12px;padding:10px 12px;font:800 .95rem var(--body);cursor:pointer}

.pf2-k>.pf2-ic svg{width:30px;height:30px}
.pf2-k>.pf2-ic.ring{flex:0 0 52px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#f2c14e2a,transparent 70%);box-shadow:none}
.pf2-k>.pf2-ic.ring svg{width:auto;height:auto}.pf2-k>.pf2-ic.ring .pf2-ring b{font-size:.9rem}
.pf2-k>.pf2-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pf2-k .pf2-tx b{font:800 .98rem/1.2 var(--display);color:#f2c14e}
.pf2-k .pf2-tx small{font:700 .78rem/1.25 var(--body);color:var(--muted)}
.pf2-k .gs-knopf{flex:none}
.pf2-k.gs-schalter>svg{display:none}
.fb-karte#fbLink2{margin:0}
.kennung{margin-top:2px}

/* 9.33: Profil-Kacheln und Seiten „Errungenschaften“ / „Statistik“ im Lernvers-Look */
.pf2-duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pf2-k.pf2-t2{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:3px;width:100%;padding:14px;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.pf2-t2>.pf2-ic{margin-bottom:8px}
.pf2-t2 b{font:800 clamp(.7rem,3.5vw,.88rem)/1.2 var(--display);color:#f2c14e;overflow-wrap:normal;white-space:nowrap;max-width:100%}
.pf2-t2 small{font:700 .78rem/1.25 var(--body);color:var(--muted)}
.pf2-karte,.pf2-kachel{border:1px solid #f2c14e38;background:radial-gradient(80% 140% at 0% 0%,#f2c14e20,transparent 60%),linear-gradient(180deg,#232a58,#1a2048);box-shadow:inset 0 1px 0 #ffffff22,0 8px 20px #0005;border-radius:18px}
.pf2-kachel small{font:700 .8rem var(--body);color:var(--muted)}
.pf2-kachel{padding:14px 8px}
.pf2-kachel svg{width:30px;height:30px}
.pf2-seg.pf2-seg2{grid-template-columns:repeat(2,minmax(0,1fr))}.pf2-seg2 button{padding:11px 4px;font-size:.82rem}
.pf2-kl{display:block;width:100%;color:inherit;font:inherit;cursor:pointer;padding:0;text-align:center}.pf2-kl:active{transform:scale(.985)}

/* 9.34: Profil kompakt (passt ohne Scrollen auf eine Seite) */
.pf3{gap:8px;padding-bottom:12px}
.pf3-ausweis{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;justify-items:stretch;text-align:left;padding:12px 14px;border-radius:18px}
.pf3-ausweis:after{display:none}
.pf3-id{display:grid;gap:4px;justify-items:start;min-width:0}
.pf3-namebox{justify-content:flex-start;width:auto}
.pf3-namebox h2{font-size:1.2rem}
.pf3-namebox .pf2-edit{width:28px;height:28px}.pf3-namebox .pf2-edit svg{width:14px;height:14px}
.pf3-ausweis .pf2-rang{font-size:.74rem;padding:1px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf3-xp{grid-column:1/-1;max-width:none;gap:3px}.pf3-xp>span{font-size:.76rem}
.pf3-hinw{grid-column:1/-1;margin:0;font-size:.74rem}
.pf3-gem{display:grid;gap:6px}
.pf3-duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pf3-btn{min-height:48px;padding:6px 8px;border-radius:14px;font-size:.88rem;line-height:1.15;text-align:center}
.pf3-gemzeile{display:flex;align-items:center;gap:8px;min-width:0;padding:0 4px}
.pf3-gemzeile .gl,.pf3-gemzeile>svg,.pf3-gemzeile>img,.pf3-gemzeile>span:first-child{flex:none}
.pf3-gemtx{flex:1;min-width:0;font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pf3-gemtx b{color:var(--fg)}
.pf3-gemzeile .pf2-link{padding:2px 4px;font-size:.78rem}
.pf3-hinw{padding:0 4px}
.pf2-k.pf3-z{min-height:46px;padding:6px 12px;border-radius:16px;gap:10px;box-shadow:inset 0 1px 0 #ffffff22,0 4px 12px #0004}
.pf2-k.pf3-z>.pf2-ic{flex:0 0 30px;width:30px;height:30px;border-radius:10px;box-shadow:0 0 10px #f2c14e30}
.pf2-k.pf3-z>.pf2-ic svg{width:22px;height:22px}
.pf3-z .pf2-tx{flex:1;min-width:0}.pf3-z .pf2-tx b{font:800 .9rem/1.2 var(--display);color:#f2c14e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf3-w{flex:none;color:var(--muted);font:700 .76rem var(--body);white-space:nowrap}
.pf3-z svg.pf2-pf{width:14px;height:14px}
.pf3-z.gs-schalter .gs-knopf{width:40px;height:22px;border-radius:11px}.pf3-z.gs-schalter .gs-knopf::after{width:16px;height:16px}.pf3-z.gs-schalter[aria-pressed="true"] .gs-knopf::after{left:21px}
.pf3-fuss{margin:2px 0 0;text-align:center;font-size:.68rem}
.pf3 .fb-karte#fbLink2{margin:4px 0 0}
/* 9.38 Fußleiste „Leuchtfeld“: aktives Symbol bleibt an seinem Platz, Lichtschein + Leuchtstreifen in der Farbe des Reiters, größere Symbole/Schrift füllen den Rahmen */
.tabbar{width:min(500px,calc(100% - 14px));height:80px;padding:0 4px;gap:0;overflow:hidden;border-radius:26px;
 background:linear-gradient(180deg,#2b3470f2,#10153af7);border:1px solid #f2c14e55;
 box-shadow:0 -8px 34px #000a,0 0 0 1px #0006,0 0 22px -8px #f2c14e66,inset 0 1px 0 #ffffff40,inset 0 -18px 30px #0a0e2a80}
.tabbar::after{content:"";position:absolute;left:14px;right:14px;bottom:7px;height:3px;border-radius:3px;background:#ffffff14;pointer-events:none}
.tabbar button{font:800 .78rem var(--body);letter-spacing:-.03em;color:#aab2e0;gap:3px;height:100%;padding:0 0 10px;min-width:0;justify-content:center;white-space:nowrap;text-shadow:none;transition:color .2s}
.tabbar .tb-ic{width:46px;height:46px;transform:none;filter:grayscale(.6) brightness(.78);transition:filter .2s}
.tabbar .tb-ic svg{width:44px;height:44px;filter:none}
.tabbar button.an{color:#fff;text-shadow:0 0 10px color-mix(in srgb,var(--ar) 70%,transparent)}
.tabbar button.an::after{content:"";position:absolute;bottom:6px;left:50%;width:34px;height:4px;transform:translateX(-50%);border-radius:4px;background:var(--ar);box-shadow:0 0 12px 3px color-mix(in srgb,var(--ar) 80%,transparent)}
.tabbar button.an .tb-ic{transform:none;filter:none}
.tabbar button.an .tb-ic svg{filter:drop-shadow(0 0 7px var(--ar))}
.tabbar [data-tab="duelle"] .tb-ic{filter:grayscale(.6) brightness(.78)}
.tabbar [data-tab="duelle"].an .tb-ic{filter:none}
.tabbar .tb-du,.tabbar button.an .tb-du{top:6px;bottom:auto;left:calc(50% + 10px);right:auto}

/* ===== 9.37 Design-Kritik Startseite ===== */
/* Schriftstufen: 12 px klein · 14 px Text · 16 px Betonung */
:root{--fs-s:.75rem;--fs-m:.875rem;--fs-l:1rem;--tap:44px}
/* 1) Install-Hinweis: schmale Zeile über der Fußleiste, Seitenrand wie die Karten (16 px) */
.ah{width:min(520px,calc(100% - 32px));bottom:calc(104px + env(safe-area-inset-bottom,0px));padding:8px 8px 8px 10px;border-radius:16px;display:flex;align-items:center;gap:10px;grid-template-columns:none;box-shadow:0 8px 20px #000a}
body.mit-app-hinweis .app{padding-bottom:calc(176px + env(safe-area-inset-bottom,0px))}
.ah-mini{width:40px;height:40px;padding:0;border-radius:10px;display:block;background:none;border:0}
.ah-mini i.ah-app{width:40px;height:40px;animation:none}
.ah-tx{flex:1}
.ah-tx b{font-size:var(--fs-m);line-height:1.2;white-space:nowrap}
.ah-tx small{font-size:var(--fs-s);line-height:1.25;color:#c4cbef;white-space:nowrap}
.ah-knopf{flex:none;min-height:var(--tap);padding:0 12px;border-radius:12px;border:1px solid #7a4e0c66;background:linear-gradient(180deg,#fff2c0,#f2c14e 55%,#c9902a);color:#2a1d02;font:800 var(--fs-m) var(--body);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.ah-knopf svg{width:16px;height:16px}
.ah-x{width:var(--tap);height:var(--tap)}
/* 2) Tippflächen mindestens 44 × 44 px */
.hud-ton{width:var(--tap);height:var(--tap);display:grid;place-items:center;opacity:.85}
.tz{min-height:var(--tap)}.tz-tx{font-size:var(--fs-m)}.tz-z{font-size:var(--fs-s)}.tz-lohn{font-size:var(--fs-s)}
.hud .pill.hud-tal{min-height:var(--tap)}
/* 3) Lesbarkeit */
.start-aufg .bk-aufg .bk-t span{font-size:var(--fs-m);color:#ffe39a}
.start-aufg .ez-keys i{width:24px;height:24px;opacity:.55}.start-aufg .ez-keys i.an{opacity:1}
.start-aufg .ez-keys.verbraucht{opacity:.5}
.bk-label{font-size:var(--fs-s)}
@media (min-height:721px){
  .start2 .lv.kompakt .lv-btn,.start-vers .lv-btn{height:var(--tap);font-size:var(--fs-m)}
  .start2 .lv.kompakt .lv-btn.rund,.start-vers .lv-btn.rund{width:var(--tap)}
  .kt-tx small{font-size:var(--fs-s);line-height:1.2;padding:3px 9px}
}
/* 4) Hierarchie: Kacheln ruhiger – der goldene Lernvers-Knopf bleibt die eine Hauptaktion */
.kt{box-shadow:0 0 0 1px #0006,0 0 14px -8px var(--c),inset 0 1px 0 #ffffff1f}
.kt::before{background:radial-gradient(circle,color-mix(in srgb,var(--c) 32%,transparent),transparent 68%)}
.kt-tx b{color:color-mix(in srgb,var(--c) 28%,#fff3dc)}
/* 5) Konsistenz: flache Symbole (Lektionen, Solo) bekommen ein Medaillon wie Biblionär und Arena */
.kt-logo.med::before{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c) 55%,#fff) 0,color-mix(in srgb,var(--c) 45%,#141845) 38%,#141845 100%);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 70%,#fff3dc),0 0 0 5px #141845,0 0 18px -2px var(--c),inset 0 -6px 12px #0006}
.kt-logo.med svg{position:relative;width:58%;height:58%}
.ah-knopf{padding:0 12px}

/* 9.47: Lernvers auf der Startseite wischbar (Vormonate) – Punkte unter der Karte, sanftes Einblenden, Gummiband am Ende */
.start-vers{touch-action:pan-y}
.lv-punkte{display:flex;justify-content:center;gap:2px;margin-top:2px}
.lv-punkte button{all:unset;box-sizing:border-box;cursor:pointer;width:22px;height:18px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.lv-punkte button i{display:block;width:6px;height:6px;border-radius:50%;background:rgba(242,193,78,.35);transition:width .2s,background .2s}
.lv-punkte button[aria-selected="true"] i{width:16px;border-radius:4px;background:#f2c14e}
.lv-punkte button:focus-visible i{outline:2px solid #fff;outline-offset:2px}
@keyframes lvEinR{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes lvEinL{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes lvEndeL{0%,100%{transform:none}40%{transform:translateX(10px)}}
@keyframes lvEndeR{0%,100%{transform:none}40%{transform:translateX(-10px)}}
.lv.lv-ein-r{animation:lvEinR .22s ease-out}.lv.lv-ein-l{animation:lvEinL .22s ease-out}
.lv.lv-ende-l{animation:lvEndeL .3s ease-out}.lv.lv-ende-r{animation:lvEndeR .3s ease-out}
/* 9.68: Wisch-Bühne – reicht bis an den Bildschirmrand und schneidet dort ab (Seite wird nie breiter),
   Polster oben/unten lassen den Lichtschein der Karte stehen; Höhe gleitet weich zur nächsten Karte. */
.lv-buehne{position:relative;margin:-14px -16px;padding:14px 16px;overflow:hidden;pointer-events:none;contain:paint}
.lv-buehne>.lv{pointer-events:auto;will-change:transform;backface-visibility:hidden}
.lv-buehne>.lv.lv-nachbar{position:absolute!important;top:14px;left:16px;right:16px;width:auto;margin:0!important}
.lv-buehne.lv-zieht>.lv{transition:none}
.lv-buehne.lv-faehrt{transition:height .38s cubic-bezier(.22,.9,.24,1)}
.lv-buehne.lv-faehrt>.lv{transition:transform .38s cubic-bezier(.22,.9,.24,1),opacity .38s ease}
.lv-buehne>.lv-nachbar,.lv-buehne.lv-zieht>.lv{box-shadow:inset 0 1px 0 #ffffff38,0 0 0 1px #0004,0 10px 22px #0005}
@media (prefers-reduced-motion:reduce){.lv-buehne.lv-faehrt,.lv-buehne.lv-faehrt>.lv{transition:none}}

/* 9.48: Lernvers-Fortschritt als Ring + Text, für alle Monate gleich */
.lv-fort{display:flex;align-items:center;gap:8px;margin-left:auto;flex:0 0 auto;text-align:right}
.lv-fort-tx{font:700 .68rem/1.25 var(--body);color:#e8dcb8}.lv-fort-tx b{display:block;font-weight:800;color:#f2c14e}
.lv-fort svg{width:36px;height:36px;flex:0 0 36px}
.lv-fort circle{fill:none;stroke-width:4}.lv-fort .sp{stroke:#ffffff22}.lv-fort .fu{stroke:#f2c14e;stroke-linecap:round}
.lv-fort text{font:800 10.5px var(--body);fill:#f6efd8}.lv-fort text.voll{font-size:8.6px;letter-spacing:-.2px}
.lv-fort.ok .fu{stroke:#7be0a8}.lv-fort.ok .fu,.lv-fort.ok .sp{stroke-dasharray:none}.lv-fort.ok .fu{stroke-dasharray:none}.lv-fort.ok .lv-fort-tx b{color:#7be0a8}
.start2 .lv.kompakt .lv-ref,.start-vers .lv-ref{margin:-3px 0 6px;font-size:.66rem;white-space:nowrap}
.start2 .lv.kompakt .lv-text{margin-bottom:8px}
@media (max-width:360px){.lv-fort-tx{display:none}}

/* 9.50: Lernvers-Karte „Himmlisches Licht“ – Schriftrolle, goldenes Band, Kreuz, dezenter Ton-Knopf darunter */
section.lv.lvd{position:relative;overflow:hidden;padding:8px 10px 10px;border-radius:22px;border:2px solid #f2c14e;box-shadow:0 8px 22px #0007,0 0 0 1px #0006;background:#1b1f4a}
.lvd:before,.lvd:after{display:none}
.lvd-szene{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.lvd-kreuz{position:absolute;z-index:1;right:0;bottom:0;width:96px;height:100px;pointer-events:none}
.lvd-kreuz svg{display:block;width:100%;height:100%}.lvd-kr{filter:drop-shadow(0 0 2.5px #f2c14e99)}
section.lv.lvd .lv-kopf{position:relative;z-index:2;display:flex;align-items:center;gap:0;margin:0 0 5px}
section.lv.lvd .lv-kopf .lv-ic{position:relative;z-index:3;flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#6a4fd0,#2b1a6e 70%);border:2.5px solid #f2c14e;box-shadow:0 0 12px #f2c14ecc,0 2px 6px #0008}
section.lv.lvd .lv-ic svg{width:20px;height:20px}
section.lv.lvd .lv-kopf .lv-lab{position:relative;z-index:2;flex:0 0 auto;margin-left:-14px;padding:4px 20px 4px 19px;font:800 .92rem var(--body);letter-spacing:0;text-transform:none;overflow:visible;color:#1d1f4a;-webkit-text-fill-color:#1d1f4a;-webkit-background-clip:border-box;background-clip:border-box;background:linear-gradient(180deg,#ffe48f,#f2b640);clip-path:polygon(0 0,100% 0,calc(100% - 9px) 50%,100% 100%,0 100%);white-space:nowrap}
section.lv.lvd .lv-fort{margin-left:auto;gap:6px;padding:3px 4px 3px 10px;flex:0 1 auto;min-width:0;border-radius:99px;background:#1c1a5acc;border:1.5px solid #8b86e8aa;box-shadow:0 2px 8px #0006}
.lvd .lv-fort svg{width:32px;height:32px;flex-basis:32px}.lvd .lv-fort .fu{stroke:#ffd45a}.lvd .lv-fort .sp{stroke:#ffffff30}
.lvd .lv-fort-tx{font-size:.62rem;color:#fff;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lvd .lv-fort-tx b{color:#ffd45a}
.lvd .lv-fort.ok .fu{stroke:#7be0a8}.lvd .lv-fort.ok .lv-fort-tx b{color:#7be0a8}
.lvd-rolle{position:relative;z-index:1;margin:0 74px 0 8px;padding:7px 20px 4px;text-align:center;border-radius:6px;background:linear-gradient(180deg,#fbefcf,#f1dba6);box-shadow:0 3px 8px #0006,inset 0 0 10px #c8985033}
.lvd-rolle:before,.lvd-rolle:after{content:"";position:absolute;top:-2px;bottom:-2px;width:11px;border-radius:7px;background:linear-gradient(90deg,#d9b676,#f6e5b8 45%,#caa25c);box-shadow:0 2px 4px #0005}
.lvd-rolle:before{left:-8px}.lvd-rolle:after{right:-8px}
section.lv.lvd .lv-text{margin:0;color:#1d1f4a;font-size:.98rem;line-height:1.26;font-weight:600;text-shadow:none;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
section.lv.lvd:not(.kompakt) .lv-text{font-size:1.06rem;line-height:1.3}
section.lv.lvd .lv-ref{display:flex;align-items:center;justify-content:center;gap:7px;margin:3px 0 0;font:800 .68rem var(--body);color:#2b2a4a;letter-spacing:0;white-space:normal}
.lvd .lv-ref:before,.lvd .lv-ref:after{content:"";height:1.5px;flex:0 1 34px;background:linear-gradient(90deg,transparent,#d9a032)}.lvd .lv-ref:after{transform:scaleX(-1)}
.lvd .lv-ref i{flex:0 0 9px;width:9px;height:9px;background:#e0a21e;clip-path:polygon(0 100%,0 30%,25% 60%,50% 0,75% 60%,100% 30%,100% 100%)}
section.lv.lvd:not(.kompakt) .lv-ref{flex-wrap:wrap;gap:2px 6px}section.lv.lvd:not(.kompakt) .lv-ref:before,section.lv.lvd:not(.kompakt) .lv-ref:after{display:none}
section.lv.lvd .lv-monat,section.lv.lvd .lv-hinweis{position:relative;z-index:1;margin:8px 74px 0 8px}
section.lv.lvd .lv-fuss{position:static;display:flex;justify-content:center;margin:7px 74px 0 8px;gap:0}
section.lv.lvd .lv-fuss .lv-btn:first-child{position:relative;z-index:2;flex:0 1 220px;height:34px;justify-content:center;border-radius:99px;font-size:.92rem;font-weight:800;color:#fff;background:linear-gradient(180deg,#5a3fc4,#2f1b78);border:2px solid #f2c14e;box-shadow:0 3px 10px #0008,inset 0 1px 0 #ffffff44}
section.lv.lvd .lv-fuss .lv-btn.gold{color:#2a1d02;background:linear-gradient(180deg,#fff2c0,#f2c14e 55%,#c9902a);border-color:#fff3c0}
section.lv.lvd .lv-fuss .lv-btn.rund{position:absolute;z-index:2;right:12px;bottom:10px;width:30px;height:30px;padding:0;border-radius:50%;background:#1c1a5acc;border:1.5px solid #f2c14e99;color:#ffe9a8;box-shadow:none}
section.lv.lvd .lv-fuss .lv-btn.rund svg{width:15px;height:15px}
section.lv.lvd .lv-fuss .lv-btn.hoert{background:color-mix(in srgb,var(--bad) 35%,#1c1a5a)}
/* 9.60 Beta-Kanal: kleine Marke oben in der Mitte (nur in der Beta-Kopie) und Tester-Liste des Verwalters */
#betaMarke{position:fixed;top:calc(env(safe-area-inset-top,0px) + 1px);left:50%;transform:translateX(-50%);z-index:6;border:0;border-radius:0 0 9px 9px;padding:1px 10px 2px;font:800 .58rem/1.3 var(--display,inherit);letter-spacing:.14em;color:#0e1226;background:linear-gradient(180deg,#ffd98a,#f2c14e);box-shadow:0 2px 8px rgba(242,193,78,.35);cursor:pointer}
.bt-zeile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:9px 4px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.07);color:inherit;font:inherit;text-align:left;cursor:pointer}
.bt-zeile b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bt-zeile small{color:var(--muted)}
.bt-zeile i{font-style:normal;font-weight:800;font-size:.72rem;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--muted)}
.bt-zeile[aria-pressed="true"] i{background:linear-gradient(180deg,#ffd98a,#f2c14e);color:#0e1226}
/* ===== 9.61 Weihnachts-Ausgabe „Stille Nacht“: Schnee, Stern, Schneehauben, Christbaumkugeln (nur mit body.weih-an) ===== */
#weihSchnee{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
#weihSchnee i{position:absolute;top:-12px;border-radius:50%;background:#fff;animation:weihFall linear infinite}
#weihSchnee svg{position:absolute;top:-16px;color:#fff;animation:weihFall linear infinite}
@keyframes weihFall{0%{transform:translate3d(0,-20px,0) rotate(0)}50%{transform:translate3d(var(--dx),50vh,0) rotate(90deg)}100%{transform:translate3d(0,104vh,0) rotate(180deg)}}
@media (prefers-reduced-motion:reduce){#weihSchnee i,#weihSchnee svg{animation-play-state:paused}}
.weih-fl{width:1em;height:1em;flex:none}
.weih-haube{position:absolute;left:-2px;right:-2px;top:-9px;height:20px;pointer-events:none;z-index:2}
.weih-haube svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 2px #0b1030aa)}

body.ed-weihnachten{--edc:#bfe3ff}body.ed-ostern{--edc:#ffd166}body.ed-pfingsten{--edc:#ff7a2e}body.ed-reformation{--edc:#ff5f6a}

}

.ed-emblem-ostern::before{background:conic-gradient(from 0deg,#ffd16600,#ffd166aa 4%,#ffd16600 9%,#ffd16600 16%,#ffd166aa 20%,#ffd16600 25%,#ffd16600 34%,#ffd166aa 38%,#ffd16600 43%,#ffd16600 52%,#ffd166aa 56%,#ffd16600 61%,#ffd16600 70%,#ffd166aa 74%,#ffd16600 79%,#ffd16600 88%,#ffd166aa 92%,#ffd16600 97%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);opacity:.8}

/* 9.70: Solo – Kachel-Raster; 9.73: Variante „Medaille“ (Symbol zentriert und groß, Stand als Plakette am Ring) */
.sok-gitter{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 4px 10px}
.sok-gitter:last-child{margin-bottom:4px}

<script>
/* 9.26: Start-Bild – der Balken zeigt die 66 Bücher der Bibel als Fortschritt (echter Ladefortschritt, mindestens ~1,4 s, damit man die Bücher durchlaufen sieht) */
(function () {
  var el = document.getElementById("splash"), txt = document.getElementById("spTxt"), zahl = document.getElementById("spZahl");
  var BUECHER = ["1. Mose","2. Mose","3. Mose","4. Mose","5. Mose","Josua","Richter","Rut","1. Samuel","2. Samuel","1. Könige","2. Könige","1. Chronik","2. Chronik","Esra","Nehemia","Ester","Hiob","Psalmen","Sprüche","Prediger","Hohelied","Jesaja","Jeremia","Klagelieder","Hesekiel","Daniel","Hosea","Joel","Amos","Obadja","Jona","Micha","Nahum","Habakuk","Zephanja","Haggai","Sacharja","Maleachi","Matthäus","Markus","Lukas","Johannes","Apostelgeschichte","Römer","1. Korinther","2. Korinther","Galater","Epheser","Philipper","Kolosser","1. Thessalonicher","2. Thessalonicher","1. Timotheus","2. Timotheus","Titus","Philemon","Hebräer","Jakobus","1. Petrus","2. Petrus","1. Johannes","2. Johannes","3. Johannes","Judas","Offenbarung"];
  var reduziert = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var MIN = reduziert ? 400 : 1400, t0 = performance.now(), ziel = 0.05, ist = 0, fertig = false, weg = false;
  function aus() { if (weg) return; weg = true; el.classList.add("weg"); setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 700); }
  function takt() {
    if (weg) return;
    var zeit = Math.min(1, (performance.now() - t0) / MIN);
    var soll = Math.min(ziel, zeit);
    if (!fertig) soll = Math.min(soll, 65 / 66);
    ist += (soll - ist) * 0.2; if (soll - ist < 0.002) ist = soll;
    var n = Math.min(66, Math.round(ist * 66));
    el.style.setProperty("--p", (n / 66).toFixed(4));
    var z = n + " <small>/ 66</small>", t = n > 0 ? BUECHER[n - 1] : BUECHER[0];
    if (zahl.innerHTML !== z) zahl.innerHTML = z; if (txt.textContent !== t) txt.textContent = t;
    if (fertig && n >= 66 && zeit >= 1) { setTimeout(aus, 250); return; }
    requestAnimationFrame(takt);
  }
  window.SPL = { set: function (p) { if (p > ziel) ziel = p; }, done: function () { fertig = true; ziel = 1; } };
  requestAnimationFrame(takt);
  setTimeout(function () { window.SPL.done(); }, 9000); /* Notausgang: nie hängen bleiben */
  setTimeout(aus, 14000);
})();
</script>
