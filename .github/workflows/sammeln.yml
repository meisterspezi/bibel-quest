# Sammel-Rangliste und Aufräumen für Bibelbuch-Quest (siehe job/sammeln.mjs).
# Braucht das Secret FIREBASE_SERVICE_ACCOUNT. Optional die Variable AUFRAEUMEN=ja (sonst wird beim Aufräumen nur gezählt).
name: Sammel-Rangliste
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      voll:
        description: "Alle Spieler neu einlesen"
        type: boolean
        default: false
      aufraeumen_jetzt:
        description: "Aufräumen jetzt ausführen (statt einmal am Tag)"
        type: boolean
        default: false
concurrency:
  group: sammeln
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Abhängigkeiten
        working-directory: job
        run: npm install --no-audit --no-fund --omit=dev
      - name: Sammeln und Aufräumen
        working-directory: job
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AUFRAEUMEN: ${{ vars.AUFRAEUMEN }}
          VOLL: ${{ inputs.voll && 'ja' || '' }}
          AUFRAEUMEN_JETZT: ${{ inputs.aufraeumen_jetzt && 'ja' || '' }}
        run: node sammeln.mjs
      - name: Fehler melden (Slack #alerts-crashes)
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then exit 0; fi
          curl -sS -X POST https://slack.com/api/conversations.join -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H "Content-Type: application/json" --data '{"channel":"C0CH6J11Z9U"}' > /dev/null
          curl -sS -X POST https://slack.com/api/chat.postMessage -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg t ":rotating_light: *Sammel-Job fehlgeschlagen* – die App liest nach 3 Stunden wieder direkt. <$LAUF|Protokoll ansehen>" '{channel:"C0CH6J11Z9U",text:$t}')" > /dev/null
