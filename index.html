<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bibelbuch-Quest</title>
<meta name="description" content="Lerne alle 66 Bücher der Bibel (Schlachter 2000) spielerisch in der richtigen Reihenfolge.">
<meta name="theme-color" content="#0e1226">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bibel-Quest">
<meta property="og:title" content="Bibelbuch-Quest">
<meta property="og:description" content="Alle 66 Bücher der Bibel spielend lernen.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@400;700;800;900&family=EB+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: eine Spiel-Spalte (max. 520px) mit Kopfleiste (Level, XP, Talente, Serie); Bildschirme wechseln darunter. Bewusst dunkles Nachthimmel-Design, Akzent per Thema tauschbar. */
:root{
  --bg:#0e1226; --bg2:#151a36; --surface:#1b2146; --surface2:#262e5e; --line:#323b74;
  --fg:#eef0ff; --muted:#a3abd8; --accent:#f2c14e; --accent-ink:#2a1d00;
  --good:#46d39a; --bad:#ff6b6b; --at:#7cc4ff; --nt:#ffa3c4;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
body[data-acc="smaragd"]{--accent:#3fd6a6;--accent-ink:#00281b}
body[data-acc="purpur"]{--accent:#c09bff;--accent-ink:#1d0b3a}
body[data-acc="morgenrot"]{--accent:#ff8a5c;--accent-ink:#2e0d00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 60%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 88% 44%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 22% 82%,#fff5 50%,transparent 51%),radial-gradient(1.5px 1.5px at 63% 88%,#fff4 50%,transparent 51%),radial-gradient(ellipse at 50% -10%,#2b2f6e 0%,transparent 60%);
  background-attachment:fixed;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font-family:var(--body);color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Kopfleiste */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding-block:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.hud-wer{display:flex;gap:10px;align-items:center;min-width:0;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}.hud-wer .xpbox{flex:1;display:block}.hud-wer .xptitle,.hud-wer .xpnum,.hud-wer .xpbar{display:block}.hud-wer .lvl{flex:none}
.lvl{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:900 1.15rem var(--body);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 55%,transparent)}
.xpbox{min-width:0}
.xptitle{font-weight:800;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:9px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#fff);transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.xpnum{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}

/* Allgemein */
h1{font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1.15;margin:6px 0 4px;letter-spacing:.02em;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0 0 4px;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900;font-size:1rem;cursor:pointer;background:var(--surface2);border-bottom:4px solid #0007;transition:transform .08s}
.btn:active{transform:translateY(3px);border-bottom-width:1px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.back{background:none;border:0;color:var(--muted);font-weight:800;padding:6px 0;cursor:pointer;font-size:.95rem}

/* Startseite */
.goal{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.ring{width:72px;height:72px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:128px;border-bottom:4px solid #0006;transition:transform .08s}
.mode:active{transform:translateY(3px)}
.mode .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2)}
.mode .ic svg{width:22px;height:22px}
.mode b{font-size:1.02rem}
.mode span{font-size:.82rem;color:var(--muted)}
.mode.big{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--surface)),var(--surface))}

/* Lernpfad */
.path{display:flex;flex-direction:column;align-items:center;gap:0;padding-block:8px}
.node{display:flex;align-items:center;gap:14px;width:100%;max-width:400px}
.node:nth-child(4n+2){padding-left:18%}.node:nth-child(4n+4){padding-right:18%;flex-direction:row-reverse;text-align:right}
.nbtn{flex:0 0 auto;width:68px;height:68px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;font:900 1.2rem var(--body);background:var(--surface2);border-bottom:6px solid #0008;position:relative}
.nbtn svg{width:26px;height:26px}
.nbtn.open{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}
.nbtn.done{background:var(--good);color:#002b19}
.nbtn.locked{opacity:.45;cursor:not-allowed}
.ninfo{min-width:0}
.ninfo b{display:block;font-size:.98rem}
.stars{display:inline-flex;gap:2px;margin-top:2px}
.stars svg{width:16px;height:16px}
.connector{width:4px;height:22px;background:var(--line);border-radius:2px}
.tag{display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.08em;padding:2px 7px;border-radius:6px;margin-bottom:3px}
.tag.at{background:color-mix(in srgb,var(--at) 22%,transparent);color:var(--at)}
.tag.nt{background:color-mix(in srgb,var(--nt) 22%,transparent);color:var(--nt)}

/* Spielflächen */
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:48px;padding:10px;border:2px dashed var(--line);border-radius:14px}
.slot{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border-radius:10px;padding:6px 10px;font-weight:800;animation:pop .25s}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:12px;padding:10px 13px;font-weight:800;font-size:1rem;background:var(--surface2);border-bottom:4px solid #0008;cursor:pointer}
.chip:active{transform:translateY(3px)}
.chip.no{background:var(--bad);color:#2b0000;animation:shake .35s}
.q{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;text-align:center;margin:6px 0;text-wrap:balance}
.qsub{text-align:center;font-size:.85rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:0;border-radius:14px;padding:16px 8px;min-height:62px;font-weight:900;font-size:1.02rem;background:var(--surface2);border-bottom:5px solid #0008;cursor:pointer}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--good);color:#002b19;animation:pop .3s}
.opt.wrong{background:var(--bad);color:#2b0000;animation:shake .35s}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:900;font-variant-numeric:tabular-nums}
.timer{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.combo{font-family:var(--display);font-weight:800;color:var(--accent);font-size:1.1rem;min-height:1.5em;text-align:center}
.combo.hot{text-shadow:0 0 12px var(--accent);animation:pulse .6s infinite alternate}
.progress{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--at),var(--nt));transition:width .3s}
.result{text-align:center}
.result .big{font-family:var(--display);font-size:2.6rem;font-weight:800;color:var(--accent)}
.rewards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* Spickzettel */
.grp{border-top:1px solid var(--line);padding-top:12px}
.grp:first-child{border-top:0;padding-top:0}
.blist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bk{display:inline-flex;gap:6px;align-items:baseline;background:var(--surface2);border-radius:9px;padding:5px 9px;font-weight:700;font-size:.93rem;border:0;cursor:pointer}
.bk .n{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bk.hid .t{color:transparent;background:var(--line);border-radius:4px}

/* Abzeichen & Laden */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.badge .medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.badge .medal svg{width:28px;height:28px}
.badge.got .medal{background:radial-gradient(circle at 35% 30%,#fff 0%,var(--accent) 45%,color-mix(in srgb,var(--accent) 50%,#000) 100%);box-shadow:0 0 16px color-mix(in srgb,var(--accent) 50%,transparent)}
.badge:not(.got){opacity:.55}
.badge b{font-size:.82rem;line-height:1.2}
.badge span{font-size:.7rem;color:var(--muted);line-height:1.25}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.swatch{height:46px;border-radius:12px}
.item .btn{padding:9px 10px;font-size:.9rem}

/* Teilen */
.qrbox{background:#fff;border-radius:18px;padding:14px;max-width:280px;margin:0 auto;box-shadow:0 0 30px color-mix(in srgb,var(--accent) 40%,transparent)}
.qrbox svg{display:block;width:100%;height:auto}
.url{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;word-break:break-all;background:var(--bg2);border-radius:10px;padding:10px;text-align:center;user-select:all}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Gemeinde */
.church{display:flex;align-items:center;gap:10px;margin-top:4px}
.church img{width:40px;height:40px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px #ffffff22,0 4px 14px #0008}
.church span{font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.church.lg img{width:56px;height:56px}

/* Rangliste */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:800;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.pod .nm{font-weight:800;font-size:.9rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .vl{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pod .base{width:100%;border-radius:12px 12px 0 0;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--muted)}
.pod.p1 .base{height:96px;background:color-mix(in srgb,#f2c14e 30%,var(--surface2));color:#f2c14e}
.pod.p2 .base{height:68px}.pod.p3 .base{height:48px}
.pod.me .nm{color:var(--accent)}
.rlist{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .rk{font-weight:900;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rrow .who{min-width:0}
.rrow .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .who span{font-size:.78rem;color:var(--muted)}
.rrow .val{font-weight:900;font-variant-numeric:tabular-nums}
.rrow.me{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:12px;border-top-color:transparent}
.rrow.me+.rrow{border-top-color:transparent}
.who .you,.you{display:inline-block;color:var(--accent-ink)!important;font-size:.65rem;font-weight:900;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.field{width:100%;font:700 1.05rem var(--body);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--fg)}
.field:focus{outline:none;border-color:var(--accent)}
.mystat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mystat div{background:var(--bg2);border-radius:12px;padding:10px 4px}
.mystat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.mystat span{font-size:.72rem;color:var(--muted)}

/* Overlays */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.float{position:fixed;z-index:41;pointer-events:none;font-weight:900;font-size:1.2rem;color:var(--accent);text-shadow:0 2px 8px #000a;animation:floatUp 1s ease-out forwards}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;background:var(--surface2);border:1px solid var(--accent);border-radius:16px;padding:12px 16px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px #000a;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3)}
.toast svg{width:30px;height:30px;flex:0 0 auto}
.modal{position:fixed;inset:0;z-index:50;background:#05071acc;display:grid;place-items:center;padding:24px;backdrop-filter:blur(4px)}
.modal .card{max-width:360px;width:100%;text-align:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.modal .lvlbig{width:96px;height:96px;margin:4px auto 10px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:900 2.4rem var(--body);box-shadow:0 0 40px var(--accent);animation:spinIn .8s cubic-bezier(.2,.9,.3,1.2)}
.modal .stars svg{width:40px;height:40px}
.shake-screen{animation:shake .35s}

@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes floatUp{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.3)}}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,30px)}}
@keyframes spinIn{from{transform:rotate(-200deg) scale(.2)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:380px){.q{font-size:1.65rem}.pill{padding:4px 7px;font-size:.82rem}.badges{grid-template-columns:repeat(2,1fr)}}

/* ===== Version 6: Ergänzungen ===== */
:root{--g-geschichte:#5fd38a;--g-lehre:#ffd95c;--g-prophetie:#ff7b7b;--serif:"EB Garamond",Georgia,"Times New Roman",serif}
code{font-family:ui-monospace,Consolas,monospace;font-size:.85em;background:var(--bg2);padding:1px 5px;border-radius:5px}
.vers{margin:0;padding:12px 14px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-radius:0 14px 14px 0;text-align:left}
.vers blockquote{margin:0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.1rem;line-height:1.45}
.vers figcaption{font-size:.74rem;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.vers.klein blockquote{font-size:1rem}
.vers .vers-label{display:block;font:800 .7rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.vers.tag::before{content:"Vers des Tages";display:block;font:800 .7rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.quests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.quests li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center}
.qcheck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.quests li.done .qcheck{background:var(--good);border-color:var(--good);color:#002b19}
.qcheck svg{width:15px;height:15px}
.qtext{font-weight:700;font-size:.92rem;min-width:0}
.qbar{display:block;height:5px;border-radius:3px;background:var(--surface2);margin-top:5px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.quests li.done .qtext{color:var(--muted)}
.qval{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bk-geschichte{color:var(--g-geschichte);font-weight:800}
.bk-lehre{color:var(--g-lehre);font-weight:800}
.bk-prophetie{color:var(--g-prophetie);font-weight:800}
.neu{text-decoration:underline dotted 2px;text-underline-offset:3px}
.liedtext{margin:0;font-size:1.04rem;line-height:1.75}
.liedtext.gross{font-size:1.14rem}
.lz{border-radius:6px;transition:background .2s,box-shadow .2s}
.schalter svg,.hilfe .label svg{width:16px;height:16px;vertical-align:-3px}
.belohnung{margin-top:4px}
.lz .sing{border-radius:5px;background:color-mix(in srgb,var(--accent) 42%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 55%,transparent);transition:background .15s,box-shadow .15s}
.lz.on{background:color-mix(in srgb,var(--accent) 24%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 24%,transparent)}
.luecke{display:inline-block;color:var(--accent);font-weight:900;letter-spacing:1px;border-bottom:2px solid var(--accent);line-height:1.1}
.snr{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--accent)}
.hinweis{margin:0;color:var(--muted);border-left:3px solid var(--g-prophetie);padding-left:8px}
.lied-mini{font-size:.92rem;line-height:1.6;padding:8px 10px;border-radius:10px;background:var(--bg2);margin-top:6px}
.lied-det{margin-top:8px}

.pf .pf-text{margin:8px 0;white-space:pre-wrap;line-height:1.45}.pf.erledigt{opacity:.6}

.avw{position:relative;display:inline-grid;place-items:center}

/* Vers-Duell */
