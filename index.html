<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bibelbuch-Quest</title>
<meta name="description" content="Lerne alle 66 Bücher der Bibel (Schlachter 2000) spielerisch in der richtigen Reihenfolge.">
<meta name="theme-color" content="#0e1226">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bibel-Quest">
<meta property="og:title" content="Bibelbuch-Quest">
<meta property="og:description" content="Alle 66 Bücher der Bibel spielend lernen.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@400;700;800;900&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: eine Spiel-Spalte (max. 520px) mit Kopfleiste (Level, XP, Talente, Serie); Bildschirme wechseln darunter. Bewusst dunkles Nachthimmel-Design, Akzent per Thema tauschbar. */
:root{
  --bg:#0e1226; --bg2:#151a36; --surface:#1b2146; --surface2:#262e5e; --line:#323b74;
  --fg:#eef0ff; --muted:#a3abd8; --accent:#f2c14e; --accent-ink:#2a1d00;
  --good:#46d39a; --bad:#ff6b6b; --at:#7cc4ff; --nt:#ffa3c4;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
body[data-acc="smaragd"]{--accent:#3fd6a6;--accent-ink:#00281b}
body[data-acc="purpur"]{--accent:#c09bff;--accent-ink:#1d0b3a}
body[data-acc="morgenrot"]{--accent:#ff8a5c;--accent-ink:#2e0d00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 60%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 88% 44%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 22% 82%,#fff5 50%,transparent 51%),radial-gradient(1.5px 1.5px at 63% 88%,#fff4 50%,transparent 51%),radial-gradient(ellipse at 50% -10%,#2b2f6e 0%,transparent 60%);
  background-attachment:fixed;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font-family:var(--body);color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Kopfleiste */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding-block:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.lvl{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:900 1.15rem var(--body);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 55%,transparent)}
.xpbox{min-width:0}
.xptitle{font-weight:800;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:9px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#fff);transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.xpnum{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}

/* Allgemein */
h1{font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1.15;margin:6px 0 4px;letter-spacing:.02em;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0 0 4px;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900;font-size:1rem;cursor:pointer;background:var(--surface2);border-bottom:4px solid #0007;transition:transform .08s}
.btn:active{transform:translateY(3px);border-bottom-width:1px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.back{background:none;border:0;color:var(--muted);font-weight:800;padding:6px 0;cursor:pointer;font-size:.95rem}

/* Startseite */
.goal{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.ring{width:72px;height:72px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:128px;border-bottom:4px solid #0006;transition:transform .08s}
.mode:active{transform:translateY(3px)}
.mode .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2)}
.mode .ic svg{width:22px;height:22px}
.mode b{font-size:1.02rem}
.mode span{font-size:.82rem;color:var(--muted)}
.mode.big{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--surface)),var(--surface))}

/* Lernpfad */
.path{display:flex;flex-direction:column;align-items:center;gap:0;padding-block:8px}
.node{display:flex;align-items:center;gap:14px;width:100%;max-width:400px}
.node:nth-child(4n+2){padding-left:18%}.node:nth-child(4n+4){padding-right:18%;flex-direction:row-reverse;text-align:right}
.nbtn{flex:0 0 auto;width:68px;height:68px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;font:900 1.2rem var(--body);background:var(--surface2);border-bottom:6px solid #0008;position:relative}
.nbtn svg{width:26px;height:26px}
.nbtn.open{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}
.nbtn.done{background:var(--good);color:#002b19}
.nbtn.locked{opacity:.45;cursor:not-allowed}
.ninfo{min-width:0}
.ninfo b{display:block;font-size:.98rem}
.stars{display:inline-flex;gap:2px;margin-top:2px}
.stars svg{width:16px;height:16px}
.connector{width:4px;height:22px;background:var(--line);border-radius:2px}
.tag{display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.08em;padding:2px 7px;border-radius:6px;margin-bottom:3px}
.tag.at{background:color-mix(in srgb,var(--at) 22%,transparent);color:var(--at)}
.tag.nt{background:color-mix(in srgb,var(--nt) 22%,transparent);color:var(--nt)}

/* Spielflächen */
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:48px;padding:10px;border:2px dashed var(--line);border-radius:14px}
.slot{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border-radius:10px;padding:6px 10px;font-weight:800;animation:pop .25s}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:12px;padding:10px 13px;font-weight:800;font-size:1rem;background:var(--surface2);border-bottom:4px solid #0008;cursor:pointer}
.chip:active{transform:translateY(3px)}
.chip.no{background:var(--bad);color:#2b0000;animation:shake .35s}
.q{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;text-align:center;margin:6px 0;text-wrap:balance}
.qsub{text-align:center;font-size:.85rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:0;border-radius:14px;padding:16px 8px;min-height:62px;font-weight:900;font-size:1.02rem;background:var(--surface2);border-bottom:5px solid #0008;cursor:pointer}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--good);color:#002b19;animation:pop .3s}
.opt.wrong{background:var(--bad);color:#2b0000;animation:shake .35s}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:900;font-variant-numeric:tabular-nums}
.timer{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.combo{font-family:var(--display);font-weight:800;color:var(--accent);font-size:1.1rem;min-height:1.5em;text-align:center}
.combo.hot{text-shadow:0 0 12px var(--accent);animation:pulse .6s infinite alternate}
.progress{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--at),var(--nt));transition:width .3s}
.result{text-align:center}
.result .big{font-family:var(--display);font-size:2.6rem;font-weight:800;color:var(--accent)}
.rewards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* Spickzettel */
.grp{border-top:1px solid var(--line);padding-top:12px}
.grp:first-child{border-top:0;padding-top:0}
.blist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bk{display:inline-flex;gap:6px;align-items:baseline;background:var(--surface2);border-radius:9px;padding:5px 9px;font-weight:700;font-size:.93rem;border:0;cursor:pointer}
.bk .n{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bk.hid .t{color:transparent;background:var(--line);border-radius:4px}

/* Abzeichen & Laden */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.badge .medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.badge .medal svg{width:28px;height:28px}
.badge.got .medal{background:radial-gradient(circle at 35% 30%,#fff 0%,var(--accent) 45%,color-mix(in srgb,var(--accent) 50%,#000) 100%);box-shadow:0 0 16px color-mix(in srgb,var(--accent) 50%,transparent)}
.badge:not(.got){opacity:.55}
.badge b{font-size:.82rem;line-height:1.2}
.badge span{font-size:.7rem;color:var(--muted);line-height:1.25}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.swatch{height:46px;border-radius:12px}
.item .btn{padding:9px 10px;font-size:.9rem}

/* Teilen */
.qrbox{background:#fff;border-radius:18px;padding:14px;max-width:280px;margin:0 auto;box-shadow:0 0 30px color-mix(in srgb,var(--accent) 40%,transparent)}
.qrbox svg{display:block;width:100%;height:auto}
.url{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;word-break:break-all;background:var(--bg2);border-radius:10px;padding:10px;text-align:center;user-select:all}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Gemeinde */
.church{display:flex;align-items:center;gap:10px;margin-top:4px}
.church img{width:40px;height:40px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px #ffffff22,0 4px 14px #0008}
.church span{font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.church.lg img{width:56px;height:56px}

/* Rangliste */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:800;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.pod .av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:900 1.3rem var(--body);color:#1b1300;position:relative}
.pod.p1 .av{width:72px;height:72px;background:radial-gradient(circle at 35% 30%,#fff7d6,#f2c14e 55%,#a8781a);box-shadow:0 0 24px #f2c14e88}
.pod.p2 .av{background:radial-gradient(circle at 35% 30%,#fff,#c9d1e8 55%,#7b86a8)}
.pod.p3 .av{background:radial-gradient(circle at 35% 30%,#ffe2c8,#d9935a 55%,#8a5228)}
.pod .nm{font-weight:800;font-size:.9rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .vl{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pod .base{width:100%;border-radius:12px 12px 0 0;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--muted)}
.pod.p1 .base{height:96px;background:color-mix(in srgb,#f2c14e 30%,var(--surface2));color:#f2c14e}
.pod.p2 .base{height:68px}.pod.p3 .base{height:48px}
.pod.me .nm{color:var(--accent)}
.rlist{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .rk{font-weight:900;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rrow .who{min-width:0}
.rrow .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .who span{font-size:.78rem;color:var(--muted)}
.rrow .val{font-weight:900;font-variant-numeric:tabular-nums}
.rrow.me{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:12px;border-top-color:transparent}
.rrow.me+.rrow{border-top-color:transparent}
.you{display:inline-block;font-size:.65rem;font-weight:900;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.field{width:100%;font:700 1.05rem var(--body);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--fg)}
.field:focus{outline:none;border-color:var(--accent)}
.mystat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mystat div{background:var(--bg2);border-radius:12px;padding:10px 4px}
.mystat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.mystat span{font-size:.72rem;color:var(--muted)}

/* Overlays */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.float{position:fixed;z-index:41;pointer-events:none;font-weight:900;font-size:1.2rem;color:var(--accent);text-shadow:0 2px 8px #000a;animation:floatUp 1s ease-out forwards}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;background:var(--surface2);border:1px solid var(--accent);border-radius:16px;padding:12px 16px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px #000a;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3)}
.toast svg{width:30px;height:30px;flex:0 0 auto}
.modal{position:fixed;inset:0;z-index:50;background:#05071acc;display:grid;place-items:center;padding:24px;backdrop-filter:blur(4px)}
.modal .card{max-width:360px;width:100%;text-align:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.modal .lvlbig{width:96px;height:96px;margin:4px auto 10px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:900 2.4rem var(--body);box-shadow:0 0 40px var(--accent);animation:spinIn .8s cubic-bezier(.2,.9,.3,1.2)}
.modal .stars svg{width:40px;height:40px}
.shake-screen{animation:shake .35s}

@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes floatUp{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.3)}}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,30px)}}
@keyframes spinIn{from{transform:rotate(-200deg) scale(.2)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:380px){.q{font-size:1.65rem}.pill{padding:4px 7px;font-size:.82rem}.badges{grid-template-columns:repeat(2,1fr)}}
</style>

</head>
<body>
<canvas id="fx"></canvas>
<div class="app" id="app">
  <div class="hud">
    <div class="lvl" id="hLvl">1</div>
    <div class="xpbox">
      <div class="xptitle" id="hTitle">Schriftrollen-Lehrling</div>
      <div class="xpbar"><i id="hBar"></i></div>
      <div class="xpnum" id="hXp">0 / 100 XP</div>
    </div>
    <div class="pills">
      <div class="pill" title="Tage-Serie"><svg viewBox="0 0 24 24"><path fill="#ff9a3c" d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 2 1 3 2 3.5C11 9 11 5 12 2z"/></svg><span id="hStreak">0</span></div>
      <div class="pill" title="Talente"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#f2c14e"/><circle cx="12" cy="12" r="6" fill="none" stroke="#a8781a" stroke-width="2"/></svg><span id="hTal">0</span></div>
      <button class="iconbtn" id="muteBtn" aria-label="Ton an oder aus"></button>
    </div>
  </div>
  <main id="screen"></main>
</div>

<script src="qrcode.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ---------- Daten ---------- */
const GROUPS=[
 {t:"AT",name:"Gesetz",books:["1. Mose","2. Mose","3. Mose","4. Mose","5. Mose"],tip:"Einfach durchzählen: 1. bis 5. Mose."},
 {t:"AT",name:"Geschichtsbücher",books:["Josua","Richter","Ruth","1. Samuel","2. Samuel","1. Könige","2. Könige","1. Chronik","2. Chronik","Esra","Nehemia","Esther"],tip:"„Josua richtet Ruth, Samuel krönt Könige“ – dann Chronik, Esra, Nehemia, Esther. Samuel, Könige und Chronik kommen immer doppelt."},
 {t:"AT",name:"Weisheitsbücher",books:["Hiob","Psalmen","Sprüche","Prediger","Hohelied"],tip:"„Hiob psalmt Sprüche, predigt das Hohelied“ – vom Leid über Gebet und Weisheit zur Liebe."},
 {t:"AT",name:"Große Propheten",books:["Jesaja","Jeremia","Klagelieder","Hesekiel","Daniel"],tip:"Jeremia schrieb auch die Klagelieder, darum folgen sie direkt. Buchstaben: J-J-K-H-D."},
 {t:"AT",name:"Kleine Propheten",books:["Hosea","Joel","Amos","Obadja","Jona","Micha","Nahum","Habakuk","Zephanja","Haggai","Sacharja","Maleachi"],tip:"In Dreierpaketen: Hosea Joel Amos · Obadja Jona Micha · Nahum Habakuk Zephanja · Haggai Sacharja Maleachi."},
 {t:"NT",name:"Evangelien & Apostelgeschichte",books:["Matthäus","Markus","Lukas","Johannes","Apostelgeschichte"],tip:"M-M-L-J, danach die Apostelgeschichte als Fortsetzung von Lukas."},
 {t:"NT",name:"Paulusbriefe",books:["Römer","1. Korinther","2. Korinther","Galater","Epheser","Philipper","Kolosser","1. Thessalonicher","2. Thessalonicher","1. Timotheus","2. Timotheus","Titus","Philemon"],tip:"Römer, 2× Korinther – „Geh essen, Pommes kosten“ (Galater, Epheser, Philipper, Kolosser) – 2× Thessalonicher, 2× Timotheus, Titus, Philemon."},

function tone(f,t0,dur,type,vol,slide){
  const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();const t=a.currentTime+t0;
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.05);
}

  tap(){tone(880,0,.05,"sine",.08)},

/* ---------- Partikel-Effekte ---------- */
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function sizeCv(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0)}
addEventListener("resize",sizeCv);sizeCv();
function accent(){return getComputedStyle(document.body).getPropertyValue("--accent").trim()||"#f2c14e"}
function burst(x,y,n,opts={}){
  if(reduced)n=Math.min(n,8);
  const cols=opts.colors||[accent(),"#ffffff","#7cc4ff","#ffa3c4","#46d39a"];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(opts.speed||5)*(0.4+Math.random());
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(opts.up||2),g:opts.g??0.18,life:1,decay:0.012+Math.random()*0.02,s:3+Math.random()*4,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.3,k:opts.kind||(Math.random()<.5?"star":"rect")})}
  if(!raf)raf=requestAnimationFrame(loop);
}
function rain(n){for(let i=0;i<n;i++)setTimeout(()=>burst(Math.random()*innerWidth,-10,1,{speed:2,up:-3,g:.12}),i*18)}
function drawStar(s){cx.beginPath();for(let i=0;i<10;i++){const r=i%2?s*.45:s,a=i*Math.PI/5-Math.PI/2;cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.closePath();cx.fill()}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of parts){p.vy+=p.g;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=p.decay;
    cx.save();cx.globalAlpha=Math.max(p.life,0);cx.fillStyle=p.c;cx.translate(p.x,p.y);cx.rotate(p.r);
    if(p.k==="star")drawStar(p.s);else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
  raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight);
}
function centerOf(el){const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}
function floatText(txt,x,y){const d=document.createElement("div");d.className="float";d.textContent=txt;d.style.left=(x-30)+"px";d.style.top=(y-20)+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}

/* ---------- Optionen ---------- */
function makeOpts(i){
  const correct=ALL[i+1].b;const pool=new Set();
  [i+2,i+3,i-1,i,i+4].forEach(k=>{if(k>=0&&k<ALL.length&&ALL[k].b!==correct)pool.add(ALL[k].b)});
  const near=shuffle([...pool]).slice(0,3);
  while(near.length<3){const r=ALL[Math.floor(Math.random()*ALL.length)].b;if(r!==correct&&!near.includes(r))near.push(r)}
  return shuffle([correct,...near]);
}

VIEWS.stage=(arg)=>{
  const gi=+arg,g=GROUPS[gi];let pos=0,err=0,peek=false;
  screen.innerHTML=`<button class="back" data-go="path">← Lernpfad</button>
  <span class="tag ${g.t.toLowerCase()}">Station ${gi+1}</span><h1>${g.name}</h1>
  <div class="card stack">
    <div class="small muted"><b style="color:var(--fg)">Merkhilfe:</b> ${g.tip}</div>
    <div class="progress"><i id="sp"></i></div>
    <div class="slots" id="slots"></div>
    <div class="pool" id="pool"></div>
    <div class="topline small"><span>Fehler: <span id="se">0</span></span><button class="btn ghost" id="peek" style="padding:7px 12px;font-size:.85rem">Spicken (max. 1 Stern)</button></div>
  </div>`;wireGo();
  const pool=$("pool");
  shuffle(g.books).forEach(b=>{const c=document.createElement("button");c.className="chip";c.textContent=b;c.onclick=()=>pick(c,b);pool.appendChild(c)});
  $("peek").onclick=()=>{peek=true;SFX.tap();$("peek").disabled=true;$("peek").textContent="Reihenfolge: "+g.books.slice(pos).join(" · ");$("peek").style.whiteSpace="normal";$("peek").style.textAlign="left"};
  function pick(c,b){
    if(b===g.books[pos]){
      pos++;SFX.right(pos);vibrate(12);const [x,y]=centerOf(c);burst(x,y,14,{speed:4});c.remove();
      const s=document.createElement("span");s.className="slot";s.textContent=b;$("slots").appendChild(s);
      $("sp").style.width=(pos/g.books.length*100)+"%";
      if(pos===g.books.length)finish();
    }else{err++;$("se").textContent=err;SFX.wrong();vibrate([40,30,40]);c.classList.remove("no");void c.offsetWidth;c.classList.add("no");setTimeout(()=>c.classList.remove("no"),400)}
  }
  function finish(){
    const stars=peek?1:err===0?3:err<=2?2:1;const prev=S.stars[gi]||0;
    if(stars>prev)S.stars[gi]=stars;
    const xp=g.books.length*5+stars*10;S.right+=g.books.length;
    SFX.win();vibrate([20,30,20,30,60]);rain(70);
    setTimeout(()=>{
      addXp(xp);addTal(Math.max(0,stars-prev)*2);
      const next=gi+1<GROUPS.length;
      modal(`<div class="label">Station geschafft</div><div class="stars" style="justify-content:center;gap:8px">${[1,2,3].map(k=>`<span style="display:inline-block;width:44px;animation:pop .4s ${k*0.15}s both">${STAR(stars>=k)}</span>`).join("")}</div>
      <h2>${err===0&&!peek?"Fehlerfrei!":err+" Fehler"}</h2><div class="rewards"><span class="pill">+${xp} XP</span>${stars>prev?`<span class="pill">+${(stars-prev)*2} Talente</span>`:""}</div>
      <button class="btn primary" data-close="${next?"next":"path"}">${next?"Nächste Station":"Zum Lernpfad"}</button><button class="btn ghost" data-close="again">Nochmal</button>`,
      r=>{if(r==="next")go("stage",gi+1);else if(r==="again")go("stage",gi);else go("path")});
    },400);
  }
};

VIEWS.blitz=()=>{
  screen.innerHTML=`${backBtn()}<h1>Blitz-Runde</h1>
  <div class="card stack" style="text-align:center">
    <p class="muted" style="margin:0">60 Sekunden: Was kommt nach dem Buch? Jede 5er-Combo erhöht den Multiplikator. Ein Fehler kostet 3 Sekunden.</p>
    <div class="label">Bereich</div>
    <div class="modes" style="grid-template-columns:repeat(3,1fr)">
      <button class="btn primary" data-s="all">Ganze Bibel</button><button class="btn" data-s="AT">AT</button><button class="btn" data-s="NT">NT</button>
    </div>
    <div class="small muted">Rekord: ${S.bestBlitz} Richtige · Beste Combo: ${S.bestCombo}</div>
  </div>`;wireGo();
  screen.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{SFX.tap();countdown(()=>playBlitz(b.dataset.s))});
};
function countdown(cb){
  let n=3;screen.innerHTML=`<div class="result" style="padding-top:80px"><div class="big" id="cd">3</div></div>`;SFX.tick();
  const t=setInterval(()=>{n--;if(n<=0){clearInterval(t);tone(1047,0,.25,"triangle",.2);cb()}else{$("cd").textContent=n;$("cd").style.animation="none";void $("cd").offsetWidth;$("cd").style.animation="pop .3s";SFX.tick()}},700);timers.push(t);
}
function playBlitz(scope){
  const idx=[];ALL.forEach((x,i)=>{if(i<ALL.length-1&&(scope==="all"||(x.t===scope&&ALL[i+1].t===scope)))idx.push(i)});
  let time=60,right=0,wrong=0,combo=0,maxCombo=0,xp=0,cur=-1,lock=false;
  screen.innerHTML=`<div class="stack">
    <div class="topline"><span id="bt">60 s</span><span>${svg("check","var(--good)").replace('<svg','<svg style="width:18px;height:18px;vertical-align:-3px"')} <span id="br">0</span></span><span id="bx">0 XP</span></div>
    <div class="timer"><i id="tb"></i></div>
    <div class="card stack"><div class="qsub">Was kommt nach</div><div class="q" id="bq"></div><div class="qsub" id="bm"></div><div class="combo" id="bc"></div><div class="opts" id="bo"></div></div>
    <button class="btn ghost" id="bstop">Runde beenden</button></div>`;
  $("bstop").onclick=end;
  const t=setInterval(()=>{time-=0.1;$("tb").style.width=Math.max(time,0)/60*100+"%";$("bt").textContent=Math.ceil(Math.max(time,0))+" s";if(time<=10&&Math.abs(time-Math.round(time))<0.05)SFX.tick();if(time<=0)end()},100);timers.push(t);
  next();
  function mult(){return Math.min(1+Math.floor(combo/5),5)}
  function next(){
    let i;do{i=idx[Math.floor(Math.random()*idx.length)]}while(idx.length>1&&i===cur);cur=i;lock=false;
    $("bq").textContent=ALL[i].b;$("bm").textContent=GROUPS[ALL[i].gi].name;
    const o=$("bo");o.innerHTML="";makeOpts(i).forEach(b=>{const btn=document.createElement("button");btn.className="opt";btn.textContent=b;btn.onclick=()=>ans(btn,b);o.appendChild(btn)});
  }
  function ans(btn,b){
    if(lock)return;const correct=ALL[cur+1].b;
    if(b===correct){lock=true;combo++;right++;maxCombo=Math.max(maxCombo,combo);const g=5*mult();xp+=g;
      btn.classList.add("right");SFX.right(combo);vibrate(10);const [x,y]=centerOf(btn);burst(x,y,10+mult()*6,{speed:3+mult()});floatText("+"+g,x,y);
      $("br").textContent=right;$("bx").textContent=xp+" XP";
      if(combo%5===0){tone(1568,0,.15,"sine",.12);shakeScreen()}
      setTimeout(next,320);
    }else{combo=0;wrong++;time-=3;btn.classList.add("wrong");SFX.wrong();vibrate([40,30,40]);shakeScreen();
      [...$("bo").children].forEach(x=>{if(x.textContent===correct)x.classList.add("right")});lock=true;setTimeout(next,700)}
    const c=$("bc");c.textContent=combo>=2?`Combo ${combo} · x${mult()}`:"";c.className="combo"+(mult()>=3?" hot":"");
  }
  function end(){
    clearTimers();const rec=right>S.bestBlitz;S.right+=right;
    if(rec)S.bestBlitz=right;if(maxCombo>S.bestCombo)S.bestCombo=maxCombo;
    const tal=Math.floor(right/5)+(rec?3:0);
    screen.innerHTML=`<div class="card result stack"><div class="label">Zeit abgelaufen</div><div class="big">${right}</div><div class="muted">Richtige · ${wrong} Fehler · beste Combo ${maxCombo}</div>${rec&&right>0?'<h2>Neuer Rekord!</h2>':''}
      <div class="rewards"><span class="pill">+${xp} XP</span><span class="pill">+${tal} Talente</span></div>
      <button class="btn primary" id="again">Nochmal</button><button class="btn ghost" data-go="home">Zur Übersicht</button></div>`;wireGo();
    $("again").onclick=()=>{SFX.tap();VIEWS.blitz()};
    if(right>0){SFX.win();if(rec)rain(90)}
    if(xp)addXp(xp);addTal(tal);save();checkBadges();
  }
}

VIEWS.chain=()=>{
  screen.innerHTML=`${backBtn()}<h1>Die Kette</h1><div class="card stack" style="text-align:center">
  <p class="muted" style="margin:0">Von 1. Mose bis Offenbarung, immer das nächste Buch. Ein Fehler beendet die Kette.</p>
  <div class="small">Rekord: <b>${S.bestChain?S.bestChain+1:0}</b> von 66 Büchern</div>
  <button class="btn primary" id="cgo">Kette starten</button></div>`;wireGo();
  $("cgo").onclick=()=>{SFX.tap();countdown(playChain)};
};
function playChain(){
  let i=0,lock=false,xp=0;
  screen.innerHTML=`<div class="stack"><div class="topline"><span><span id="cp">1</span> / 66</span><span id="cx">0 XP</span></div>
  <div class="progress"><i id="cbar"></i></div>
  <div class="card stack"><div class="qsub">Was kommt nach</div><div class="q" id="cq"></div><div class="qsub" id="cm"></div><div class="combo" id="cc"></div><div class="opts" id="co"></div></div>
  <button class="btn ghost" data-go="home">Abbrechen</button></div>`;wireGo();
  show();
  function show(){
    lock=false;$("cq").textContent=ALL[i].b;$("cm").textContent=`${ALL[i].t==="AT"?"Altes":"Neues"} Testament · ${GROUPS[ALL[i].gi].name}`;
    $("cp").textContent=i+1;$("cbar").style.width=(i/65*100)+"%";
    const o=$("co");o.innerHTML="";makeOpts(i).forEach(b=>{const btn=document.createElement("button");btn.className="opt";btn.textContent=b;btn.onclick=()=>ans(btn,b);o.appendChild(btn)});
  }
  function ans(btn,b){
    if(lock)return;lock=true;const correct=ALL[i+1].b;
    if(b===correct){
      i++;xp+=4;btn.classList.add("right");SFX.right(Math.min(i/4,12));vibrate(10);const [x,y]=centerOf(btn);burst(x,y,12);$("cx").textContent=xp+" XP";
      if(i===39){$("cc").textContent="Altes Testament geschafft!";tone(1047,0,.4,"triangle",.15);rain(50)}
      else if(i>39)$("cc").textContent="";
      if(i===65)return setTimeout(()=>done(true),350);
      setTimeout(show,330);
    }else{
      btn.classList.add("wrong");SFX.wrong();vibrate([60,40,60]);shakeScreen();
      [...$("co").children].forEach(x=>{if(x.textContent===correct)x.classList.add("right")});
      setTimeout(()=>done(false,correct),1300);
    }
  }
  function done(full,correct){
    const rec=i>S.bestChain;if(rec)S.bestChain=i;S.right+=i;
    let tal=Math.floor(i/10)+(full?20:0);if(full)xp+=200;
    screen.innerHTML=`<div class="card result stack"><div class="label">${full?"Unglaublich":"Kette gerissen"}</div><div class="big">${i+1} / 66</div>
      <div class="muted">${full?"Du kennst alle 66 Bücher in der richtigen Reihenfolge!":`Nach „${ALL[i].b}“ kommt „${correct}“.`}</div>${rec&&!full?'<h2>Neuer Rekord!</h2>':''}
      <div class="rewards"><span class="pill">+${xp} XP</span><span class="pill">+${tal} Talente</span></div>
      <button class="btn primary" id="cagain">Nochmal</button><button class="btn ghost" data-go="home">Zur Übersicht</button></div>`;wireGo();
    $("cagain").onclick=()=>{SFX.tap();countdown(playChain)};
    if(full){SFX.level();rain(200)}else if(rec)SFX.win();
    if(xp)addXp(xp);addTal(tal);save();checkBadges();
  }
}

  let n=0,html=`${backBtn()}<h1>Spickzettel</h1><p class="muted small" style="margin:0 0 12px">Tippe ein Buch an, um es zu verdecken. Oder verdecke alle und prüfe dich selbst.</p>
  <div class="topline" style="margin-bottom:12px"><button class="btn" id="hideAll">Alle verdecken</button><button class="btn ghost" id="showAll">Alle zeigen</button></div><div class="card stack">`;
  GROUPS.forEach(g=>{html+=`<div class="grp"><span class="tag ${g.t.toLowerCase()}">${g.t}</span> <b>${g.name}</b><div class="small muted">${g.tip}</div><div class="blist">`+
    g.books.map(b=>{n++;return `<button class="bk"><span class="n">${n}</span><span class="t">${b}</span></button>`}).join("")+`</div></div>`});
  screen.innerHTML=html+"</div>";wireGo();
  const bks=[...screen.querySelectorAll(".bk")];
  bks.forEach(b=>b.onclick=()=>{b.classList.toggle("hid");SFX.tap()});
  $("hideAll").onclick=()=>{bks.forEach(b=>b.classList.add("hid"));SFX.tap();screen.dataset.all="1"};
  $("showAll").onclick=()=>{bks.forEach(b=>b.classList.remove("hid"));SFX.tap()};
  // Abzeichen: nach "Alle verdecken" jedes Buch einzeln wieder aufgedeckt
  bks.forEach(b=>b.addEventListener("click",()=>{if(screen.dataset.all==="1"&&!S.peeked&&bks.every(x=>!x.classList.contains("hid"))){S.peeked=true;save();checkBadges();addXp(20)}}));
};

VIEWS.shop=()=>{

  <div class="shop">${THEMES.map(t=>{const own=S.owned.includes(t.id),act=S.theme===t.id;
    return `<div class="item"><div class="swatch" style="background:linear-gradient(135deg,${t.c},#1b2146)"></div><b>${t.name}</b>
    <button class="btn ${act?"ghost":own?"":"primary"}" data-t="${t.id}" ${act?"disabled":""}>${act?"Aktiv":own?"Verwenden":t.price+" Talente"}</button></div>`}).join("")}</div>`;wireGo();
  screen.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    const t=THEMES.find(x=>x.id===b.dataset.t);
    if(!S.owned.includes(t.id)){
      if(S.tal<t.price){SFX.wrong();b.textContent=`Noch ${t.price-S.tal} Talente`;shakeScreen();return}

    }else SFX.tap();
    S.theme=t.id;applyTheme();save();renderHud();const [x,y]=centerOf(b);burst(x,y,50,{up:4});checkBadges();VIEWS.shop();
  });
};

/* ---------- Gemeinde-Rangliste ---------- */
let lbTimer=null;
function lbPayload(){
  const wk=weekKey();
  return {name:S.lbName,xp:Math.round(S.xp),level:levelOf(S.xp),bestChain:Math.min(S.bestChain|0,65),
    stars:Object.values(S.stars).reduce((a,b)=>a+b,0),badges:S.badges.length,
    streak:(S.lastDay===today()||S.lastDay===yesterday())?S.streak|0:0,week:wk,weekXp:S.weekKey===wk?Math.round(S.weekXp):0};
}
function lbSync(now){
  const L=window.LB;if(!S.lbName||!L||!L.ok)return;
  clearTimeout(lbTimer);lbTimer=setTimeout(()=>L.push(lbPayload()).catch(()=>{}),now?0:2500);
}
addEventListener("lb-ready",()=>{if(S.lbName)lbSync(true);if(current==="rank")go("rank");else if(current==="home")go("home")});

const RANK_TABS={woche:{label:"Woche",val:r=>r.weekXp||0,unit:"XP"},gesamt:{label:"Gesamt",val:r=>r.xp||0,unit:"XP"},kette:{label:"Kette",val:r=>r.bestChain?r.bestChain+1:0,unit:"Bücher"}};
let rankTab="woche";

  if(tab&&RANK_TABS[tab])rankTab=tab;

  $("leave").onclick=()=>{SFX.tap();$("rextra").innerHTML=`<div class="card stack"><b>Aus der Rangliste austreten?</b><p class="small muted" style="margin:0">Dein Eintrag wird für alle gelöscht. Dein Spielstand auf diesem Gerät bleibt erhalten.</p><div class="topline"><button class="btn" id="lvNo">Abbrechen</button><button class="btn primary" id="lvYes">Austreten</button></div></div>`;
    $("lvNo").onclick=()=>{$("rextra").innerHTML=""};
    $("lvYes").onclick=async()=>{try{await L.remove()}catch(e){}S.lbName="";save();go("rank")}};
  const me=L.uid;const wk=weekKey();
  lbUnsub=L.watch(rankTab,wk,rows=>{
    if(current!=="rank")return;
    rows=rows.filter(r=>T.val(r)>0||r.id===me).sort((a,b)=>T.val(b)-T.val(a)||String(a.name).localeCompare(String(b.name)));
    const myIdx=rows.findIndex(r=>r.id===me);
    if(rankTab==="woche"&&myIdx>-1&&myIdx<3&&rows.length>=3&&T.val(rows[myIdx])>0&&!S.podium){S.podium=true;save();checkBadges()}
    const body=$("rbody");
    if(!rows.length){body.innerHTML=`<p class="muted" style="margin:0">${rankTab==="woche"?"Diese Woche hat noch niemand gespielt. Hol dir den ersten Platz!":"Noch keine Einträge."}</p>`}
    else{
      const top=rows.slice(0,3);const order=[1,0,2].filter(i=>top[i]);
      const pod=`<div class="podium">${order.map(i=>{const r=top[i];return `<div class="pod p${i+1} ${r.id===me?"me":""}"><div class="av">${esc(String(r.name||"?").charAt(0).toUpperCase())}</div><div class="nm">${esc(r.name)}</div><div class="vl">${T.val(r)} ${T.unit}</div><div class="base">${i+1}</div></div>`}).join("")}</div>`;
      const rest=rows.slice(3,60).map((r,k)=>`<div class="rrow ${r.id===me?"me":""}"><div class="rk">${k+4}</div><div class="who"><b>${esc(r.name)}${r.id===me?'<span class="you">DU</span>':""}</b><span>Level ${r.level||1} · ${esc(titleOf(r.level||1))}${r.streak>1?` · ${r.streak} Tage Serie`:""}</span></div><div class="val">${T.val(r)}</div></div>`).join("");
      body.innerHTML=`<div class="label">${rankTab==="woche"?"Wochenrennen "+wk.split("-W")[1]+". KW":rankTab==="kette"?"Längste Kette":"Gesamtpunkte"} · ${rows.length} ${rows.length===1?"Spieler":"Spieler"}</div>${pod}${rest?`<div class="rlist">${rest}</div>`:""}`;
    }
    const mine=myIdx>-1?myIdx+1:"–";const mv=myIdx>-1?T.val(rows[myIdx]):0;
    const ahead=myIdx>0?T.val(rows[myIdx-1])-mv:0;
    $("rme").innerHTML=`<div class="mystat"><div><b>${mine}</b><span>Dein Platz</span></div><div><b>${mv}</b><span>${T.unit}</span></div><div><b>${myIdx>0?"+"+(ahead+1):myIdx===0?"👑":"–"}</b><span>${myIdx>0?"bis Platz "+myIdx:myIdx===0?"Spitze!":"noch kein Platz"}</span></div></div>
      ${myIdx>0?`<p class="small muted" style="margin:0">Noch ${ahead+1} ${T.unit} und du überholst ${esc(rows[myIdx-1].name)}.</p>`:""}`;
  },()=>{if($("rbody"))$("rbody").innerHTML=`<p class="muted" style="margin:0">Rangliste konnte nicht geladen werden. Prüfe die Internetverbindung.</p>`});
};

/* ---------- PWA ---------- */
let deferredInstall=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(current==="home")go("home")});
addEventListener("appinstalled",()=>{deferredInstall=null;S.tal+=10;save();renderHud();SFX.badge();toast(`${svg("down",accent())}<div><b>App installiert!</b><div class="small muted">+10 Talente als Dankeschön</div></div>`)});
if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}

/* ---------- Start ---------- */
applyTheme();renderMute();renderHud();go("home");
document.addEventListener("pointerdown",()=>{ac()},{once:true});
</script>
<script type="module" src="leaderboard.js"></script>
