# Bibelbuch-Quest – Slack-Brücke (Cloudflare Worker). Wird über .github/workflows/worker.yml veröffentlicht.
# Geheimnisse (NICHT hier eintragen, nur als GitHub-Secrets): SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET, FIREBASE_SERVICE_ACCOUNT
name = "bibel-quest-slack"
main = "worker.mjs"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
PROJEKT = "bibel-quest"
K_FEEDBACK = "C0CH2A8TGSX"   # user-feedback (Gespräche mit Spielern, „An Name:“, Feedback ohne Kategorie)
K_IDEE = "C0CHAST8U0Z"       # feedback-idee
K_FEHLER = "C0CJ3BL2Q4Q"     # feedback-fehler
K_LOB = "C0CGTJWJAG7"        # feedback-lob
K_FRAGE = "C0CH8QASGQ2"      # feedback-frage
K_ALARM = "C0CH6J11Z9U"      # alerts-crashes
K_METRIK = "C0CH38EAFDK"     # metrics
K_PATCH = "C0CJ2U1PCLQ"      # patchnotes
# Slack-Mitglieder-IDs (mit Komma getrennt), die Patchnotes senden und Spielern schreiben dürfen. Leer = jedes menschliche Mitglied des Kanals.
ADMINS = "U0CGB9GHFB9"   # Michael

[triggers]
# alle 15 Minuten: Liegengebliebenes nachsenden · täglich 18:00 UTC (19/20 Uhr in Deutschland): Tageszahlen
crons = ["*/15 * * * *", "0 18 * * *"]
